<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KÜRESEL HAFIZA | HAFTALIK RAPORLAR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', 'Inter', sans-serif; background: #02040a; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(16px); padding: 10px 16px; border-bottom: 2px solid #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25); display: flex; justify-content: space-between; align-items: center; z-index: 1001; }
        .logo { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; color: #38bdf8; letter-spacing: 1.2px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        
        .back-btn { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; padding: 6px 14px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: all 0.2s ease; }
        .back-btn:hover { background: #0284c7; color: #fff; box-shadow: 0 0 15px rgba(2, 132, 199, 0.6); }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #02040a; width: 100%; height: 100%; }
        
        /* SOL PANEL: KRONOLOJİ VE ARAMA */
        .sidebar { width: 360px; min-width: 360px; background: #0a0f1d; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        .search-box { padding: 12px; background: #050811; border-bottom: 1px solid #1e293b; }
        .search-box input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #38bdf8; color: #f1f5f9; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; }
        
        .reports-list { overflow-y: auto; flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .report-card { padding: 14px; background: #0f172a; border-radius: 6px; border: 1px solid #1e293b; cursor: pointer; transition: all 0.2s ease; }
        .report-card:hover, .report-card.active { background: #1e293b; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }
        .report-card .date { font-size: 0.72rem; color: #f59e0b; font-weight: 700; margin-bottom: 4px; }
        .report-card h3 { font-size: 0.92rem; color: #f8fafc; line-height: 1.4; font-weight: 700; margin-bottom: 6px; }
        .report-card p { font-size: 0.78rem; color: #94a3b8; font-family: 'Inter', sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .tag { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; cursor: pointer; }
        .tag:hover { background: #38bdf8; color: #02040a; }

        /* SAĞ PANEL: DETAY OKUMA ALANI */
        .main-content { flex: 1; background: #02040a; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .report-detail { max-width: 900px; margin: 0 auto; width: 100%; background: #0a0f1d; border: 1px solid #1e293b; border-radius: 8px; padding: 25px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .detail-header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        .detail-date { color: #f59e0b; font-size: 0.85rem; font-weight: 800; }
        .detail-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; color: #38bdf8; margin-top: 5px; line-height: 1.3; }
        
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin: 20px 0; border: 1px solid #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .infographic { max-width: 100%; border-radius: 8px; margin: 20px 0; border: 1px solid #334155; }
        
        .report-text { font-family: 'Inter', sans-serif; font-size: 0.95rem; line-height: 1.7; color: #cbd5e1; }
        
        @media (max-width: 900px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: 40%; }
            .main-content { height: 60%; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">📊 HAFTALIK STRATEJİK RAPORLAR</div>
    <a href="index.html" class="back-btn">← 3D CANLI HARİTAYA DÖN</a>
</header>

<div class="app-container">
    <div class="sidebar">
        <div class="search-box">
            <input type="text" id="reportSearchInput" placeholder="Raporlarda veya etiketlerde ara..." onkeyup="filterReports()">
        </div>
        <div class="reports-list" id="reportsList">Raporlar yükleniyor...</div>
    </div>

    <div class="main-content">
        <div class="report-detail" id="reportDetail">
            <div style="text-align: center; color: #64748b; margin-top: 50px;">Detaylarını incelemek istediğiniz raporu soldaki listeden seçin.</div>
        </div>
    </div>
</div>

<script>
    let allReports = [];

    function normalizeStr(str) {
        if (!str) return "";
        return str.trim().toLowerCase().replace(/ı/g, "i").replace(/i̇/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c");
    }

    function getYouTubeEmbedUrl(url) {
        if (!url) return '';
        let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        let match = url.match(regExp);
        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : '';
    }

    async function fetchReports() {
        try {
            const response = await fetch('reportsData.json?t=' + new Date().getTime());
            allReports = await response.json();
            allReports.reverse(); // En yeni rapor en üstte
            renderReportsList(allReports);
            if(allReports.length > 0) selectReport(allReports[0].id);
        } catch (err) {
            document.getElementById('reportsList').innerHTML = '<p style="padding:15px; color:#ef4444;">Rapor verisi yüklenemedi.</p>';
        }
    }

    function renderReportsList(reports) {
        const listEl = document.getElementById('reportsList');
        listEl.innerHTML = '';

        reports.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `report-card ${index === 0 ? 'active' : ''}`;
            card.id = `card-${item.id}`;
            card.onclick = () => selectReport(item.id);

            const tagsHtml = item.tags ? item.tags.map(t => `<span class="tag" onclick="event.stopPropagation(); filterByTag('${t}')">#${t}</span>`).join('') : '';

            card.innerHTML = `
                <div class="date">📅 ${item.date}</div>
                <h3>${item.title}</h3>
                <p>${item.summary}</p>
                <div class="tags">${tagsHtml}</div>
            `;
            listEl.appendChild(card);
        });
    }

    function selectReport(id) {
        document.querySelectorAll('.report-card').forEach(c => c.classList.remove('active'));
        const selectedCard = document.getElementById(`card-${id}`);
        if(selectedCard) selectedCard.classList.add('active');

        const report = allReports.find(r => r.id === id);
        if(!report) return;

        const embedUrl = getYouTubeEmbedUrl(report.videoUrl);
        const tagsHtml = report.tags ? report.tags.map(t => `<span class="tag">#${t}</span>`).join('') : '';

        document.getElementById('reportDetail').innerHTML = `
            <div class="detail-header">
                <div class="detail-date">📅 YAYIN TARİHİ: ${report.date}</div>
                <h1 class="detail-title">${report.title}</h1>
                <div class="tags" style="margin-top:10px;">${tagsHtml}</div>
            </div>
            
            ${embedUrl ? `<div class="video-container"><iframe src="${embedUrl}" allowfullscreen></iframe></div>` : ''}
            ${report.imageUrl ? `<img src="${report.imageUrl}" class="infographic" alt="Rapor Görseli">` : ''}
            
            <div class="report-text">${report.content}</div>
        `;
    }

    function filterReports() {
        const query = normalizeStr(document.getElementById('reportSearchInput').value);
        const filtered = allReports.filter(r => {
            const titleMatch = normalizeStr(r.title).includes(query);
            const summaryMatch = normalizeStr(r.summary).includes(query);
            const contentMatch = normalizeStr(r.content).includes(query);
            const tagMatch = r.tags ? r.tags.some(t => normalizeStr(t).includes(query)) : false;
            return titleMatch || summaryMatch || contentMatch || tagMatch;
        });
        renderReportsList(filtered);
    }

    function filterByTag(tagName) {
        document.getElementById('reportSearchInput').value = tagName;
        filterReports();
    }

    fetchReports();
</script>
</body>
</html>

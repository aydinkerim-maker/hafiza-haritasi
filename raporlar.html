<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haftalık Raporlar - Küresel Hafıza</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #334155; margin-bottom: 30px; }
        h1 { color: #38bdf8; margin: 0; }
        p.subtitle { color: #94a3b8; font-size: 14px; }
        .nav-link { color: #38bdf8; text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .reports-container { max-width: 900px; margin: 0 auto; }
        .report-card { background: #1e293b; border-radius: 12px; padding: 25px; margin-bottom: 30px; border: 1px solid #334155; }
        .report-title { color: #f1f5f9; margin-top: 0; font-size: 22px; }
        .report-date { color: #64748b; font-size: 12px; margin-bottom: 15px; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin: 20px 0; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .infographic { max-width: 100%; border-radius: 8px; margin: 20px 0; border: 1px solid #334155; }
        .report-body { line-height: 1.7; color: #cbd5e1; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="reports-container">
        <a href="index.html" class="nav-link">← Ana Sayfaya Dön (Günlük Haberler)</a>
        <header>
            <h1>Haftalık Küresel Analiz & Raporlar</h1>
            <p class="subtitle">Uluslararası ilişkiler, stratejik özetler, infografikler ve NotebookLM analizleri</p>
        </header>

        <div id="reportsList">Raporlar yükleniyor...</div>
    </div>

    <script>
        function getYouTubeEmbedUrl(url) {
            if (!url) return '';
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : '';
        }

        async function loadReports() {
            try {
                const response = await fetch('reportsData.json?t=' + new Date().getTime());
                const reports = await response.json();
                
                const container = document.getElementById('reportsList');
                container.innerHTML = '';

                reports.reverse().forEach(report => {
                    const embedUrl = getYouTubeEmbedUrl(report.videoUrl);
                    
                    const card = document.createElement('div');
                    card.className = 'report-card';
                    card.innerHTML = `
                        <div class="report-date">📅 ${report.date}</div>
                        <h2 class="report-title">${report.title}</h2>
                        
                        ${embedUrl ? `<div class="video-container"><iframe src="${embedUrl}" allowfullscreen></iframe></div>` : ''}
                        ${report.imageUrl ? `<img src="${report.imageUrl}" class="infographic" alt="Haftalık Infografik">` : ''}
                        
                        <div class="report-body">${report.content}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('reportsList').innerHTML = '<p>Henüz yayınlanmış bir rapor bulunmuyor veya yüklenirken bir hata oluştu.</p>';
            }
        }

        loadReports();
    </script>
</body>
</html>

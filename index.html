<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeopolitik Hafıza & İstihbarat Portalı</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #090d16; 
            color: #f1f5f9; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        /* HEADER: Komuta Merkezi Estetiği */
        header { 
            background: rgba(15, 23, 42, 0.95); 
            backdrop-filter: blur(12px);
            padding: 10px 16px; 
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            z-index: 1001; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { 
            font-size: 1.05rem; 
            font-weight: 800; 
            color: #38bdf8; 
            letter-spacing: 1px; 
            display: flex; 
            align-items: center; 
            gap: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }
        
        /* Canlı Sinyal Işığı */
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            color: #22c55e;
            font-weight: 700;
            background: rgba(34, 197, 94, 0.1);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .header-controls { display: flex; flex-direction: column; gap: 8px; }
        .org-menu { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .org-menu::-webkit-scrollbar { display: none; }
        
        /* Neon Butonlar */
        .org-btn { 
            background: #1e293b; 
            color: #94a3b8; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            padding: 6px 12px; 
            border-radius: 6px; 
            font-size: 0.73rem; 
            font-weight: 600;
            cursor: pointer; 
            white-space: nowrap; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .org-btn:hover { background: #334155; color: #fff; border-color: rgba(56, 189, 248, 0.4); }
        .org-btn.active { 
            background: linear-gradient(135deg, #0284c7, #0369a1); 
            color: #fff; 
            border-color: #38bdf8; 
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
        }

        .mobile-view-tabs { display: none; gap: 6px; background: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .tab-btn { flex: 1; padding: 8px 0; border: none; background: #1e293b; color: #94a3b8; font-size: 0.78rem; font-weight: 700; cursor: pointer; border-radius: 6px; text-align: center; transition: 0.2s; }
        .tab-btn.active { color: #fff; background: linear-gradient(135deg, #0284c7, #0369a1); box-shadow: 0 0 10px rgba(2, 132, 199, 0.4); }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #090d16; }
        
        /* SOL MENÜ: Haber Kartları */
        .sidebar { width: 350px; background: #0f172a; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; z-index: 10; }
        .role-filter-bar { padding: 10px; background: #090d16; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; gap: 5px; }
        .role-btn { flex: 1; padding: 7px 2px; font-size: 0.7rem; border: none; border-radius: 5px; cursor: pointer; font-weight: 700; text-align: center; color: #fff; opacity: 0.5; transition: all 0.2s; }
        .role-btn.active, .role-btn:hover { opacity: 1; transform: translateY(-1px); }
        .role-all { background: #475569; }
        .role-actor { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
        .role-supporter { background: linear-gradient(135deg, #38bdf8, #0284c7); box-shadow: 0 0 8px rgba(56, 189, 248, 0.4); }
        .role-mediator { background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }

        .news-list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
        .news-card { 
            padding: 14px; 
            background: #1e293b; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.05); 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .news-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: #38bdf8;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .news-card:hover { background: #273549; transform: translateX(3px); }
        .news-card.active { 
            background: #273549; 
            border-color: rgba(56, 189, 248, 0.4); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .news-card.active::before { opacity: 1; }
        .news-card h3 { font-size: 0.88rem; margin-bottom: 8px; color: #f8fafc; line-height: 1.4; font-weight: 600; }
        .tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { background: rgba(56, 189, 248, 0.12); color: #38bdf8; font-size: 0.63rem; padding: 2px 7px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); font-weight: 600; }

        /* HARİTA ALANI */
        .map-container { flex: 1; position: relative; background: #090d16; }
        #map { width: 100%; height: 100%; background: #090d16; }

        /* Ülke Kartı Glow */
        .country-card { 
            position: absolute; 
            top: 16px; 
            right: 16px; 
            z-index: 1000; 
            background: rgba(15, 23, 42, 0.92); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            border-radius: 10px; 
            padding: 14px 16px; 
            width: 270px; 
            display: none; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(56, 189, 248, 0.15); 
        }
        .country-card h3 { font-size: 1rem; color: #38bdf8; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; font-weight: 700; }
        .country-info-grid { font-size: 0.78rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: #cbd5e1; }

        /* SAĞ PANEL: Analiz & Derin Hafıza */
        .info-panel { width: 370px; background: #0f172a; border-left: 1px solid rgba(255,255,255,0.08); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; z-index: 10; }
        .panel-block { background: #1e293b; padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .panel-block h4 { font-size: 0.75rem; color: #38bdf8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.8px; font-weight: 700; }
        .panel-block p { font-size: 0.82rem; color: #cbd5e1; line-height: 1.6; white-space: pre-line; }
        
        .history-block { 
            border-left: 4px solid #f59e0b; 
            background: linear-gradient(135deg, rgba(30, 41, 59, 1), rgba(245, 158, 11, 0.05));
        }
        .history-block h4 { color: #f59e0b; }

        .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .legend-item:last-child { border-bottom: none; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; display: inline-block; box-shadow: 0 0 8px currentColor; }
        
        .source-btn { 
            display: inline-block; 
            width: 100%; 
            text-align: center; 
            background: linear-gradient(135deg, #0284c7, #0369a1); 
            color: #fff; 
            text-decoration: none; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 0.82rem; 
            font-weight: 700; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s;
        }
        .source-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5); }

        @media (max-width: 768px) {
            header { padding: 10px; }
            .mobile-view-tabs { display: flex; }
            .app-container { flex-direction: column; }
            
            .sidebar, .info-panel, .map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
            
            .sidebar.mobile-active { display: flex; width: 100%; }
            .map-container.mobile-active { display: block; }
            .info-panel.mobile-active { display: flex; width: 100%; border-left: none; }
            
            .country-card { top: 12px; right: 12px; left: 12px; width: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                JEOPOLİTİK HAFIZA PORTALI
            </div>
            <div class="live-indicator">
                <div class="pulse-dot"></div> CANLI AKIŞ
            </div>
        </div>
        <div class="header-controls">
            <div class="org-menu">
                <button class="org-btn active" id="btn-org-ALL" onclick="filterOrg('ALL')">Tüm Bölge</button>
                <button class="org-btn" id="btn-org-NATO" onclick="filterOrg('NATO')">NATO</button>
                <button class="org-btn" id="btn-org-UN" onclick="filterOrg('UN')">Birleşmiş Milletler (BM)</button>
                <button class="org-btn" id="btn-org-SCO" onclick="filterOrg('SCO')">Şanghay İşbirliği</button>
                <button class="org-btn" id="btn-org-BRICS" onclick="filterOrg('BRICS')">BRICS</button>
                <button class="org-btn" id="btn-org-TDT" onclick="filterOrg('TDT')">Türk Devletleri B.</button>
                <button class="org-btn" id="btn-org-EU" onclick="filterOrg('EU')">Avrupa Birliği (AB)</button>
                <button class="org-btn" id="btn-org-ARAB" onclick="filterOrg('ARAB')">Arap Birliği</button>
            </div>
            <div class="mobile-view-tabs">
                <button class="tab-btn" onclick="switchMobileTab('news')">📰 Haberler</button>
                <button class="tab-btn active" onclick="switchMobileTab('map')">🗺️ Harita</button>
                <button class="tab-btn" onclick="switchMobileTab('panel')">📊 Analiz</button>
            </div>
        </div>
    </header>

    <div class="app-container">
        <div class="sidebar" id="sidebarSection">
            <div class="role-filter-bar">
                <button class="role-btn role-all active" onclick="filterRole('ALL')">Tümü</button>
                <button class="role-btn role-actor" onclick="filterRole('Aktör')">Aktör</button>
                <button class="role-btn role-supporter" onclick="filterRole('Destekçi')">Destekçi</button>
                <button class="role-btn role-mediator" onclick="filterRole('Arabulucu')">Arabulucu</button>
            </div>
            <div class="news-list" id="newsList"></div>
        </div>

        <div class="map-container mobile-active" id="mapSection">
            <div id="map"></div>
            <div class="country-card" id="countryCard">
                <h3 id="cardCountryName">Ülke Adı</h3>
                <div class="country-info-grid">
                    <div><strong>Kuruluş:</strong> <span id="cardFounding">-</span></div>
                    <div><strong>Nüfus:</strong> <span id="cardPop">-</span></div>
                    <div><strong>Yüzölçümü:</strong> <span id="cardArea">-</span></div>
                    <div><strong>Pakt:</strong> <span id="cardPact">-</span></div>
                </div>
            </div>
        </div>

        <div class="info-panel" id="panelSection">
            <div class="panel-block">
                <h4>Haber Özeti (Detaylı)</h4>
                <p id="summaryText">Lütfen bir gelişme seçin.</p>
            </div>

            <div class="panel-block">
                <h4>Olaydaki Aktörler & Konumları</h4>
                <div id="countryLegend"></div>
            </div>

            <div class="panel-block history-block">
                <h4>Tarihsel Arka Plan & Derin Hafıza</h4>
                <p id="historyText">Tarihsel arka plan yükleniyor...</p>
            </div>

            <a href="#" id="sourceLink" target="_blank" class="source-btn" style="display: none;">Kaynak Habere Git &rarr;</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const countryProfiles = {
            "Turkey": { trName: "Türkiye Cumhuriyeti", founding: "1923", pop: "85 Milyon", area: "783,562 km²", pact: "NATO, G20, TDT" },
            "Ukraine": { trName: "Ukrayna", founding: "1991", pop: "38 Milyon", area: "603,628 km²", pact: "AB Adayı, AGİT" },
            "Russia": { trName: "Rusya Federasyonu", founding: "1991", pop: "144 Milyon", area: "17,098,242 km²", pact: "BM, ŞİÖ, BRICS" },
            "Greece": { trName: "Yunanistan", founding: "1830", pop: "10.4 Milyon", area: "131,957 km²", pact: "AB, NATO" },
            "United States": { trName: "Amerika Birleşik Devletleri", founding: "1776", pop: "331 Milyon", area: "9,833,520 km²", pact: "NATO, G7, BM" },
            "United Kingdom": { trName: "İngiltere (Birleşik Krallık)", founding: "1707", pop: "67 Milyon", area: "242,495 km²", pact: "NATO, BM, G7" },
            "Canada": { trName: "Kanada", founding: "1867", pop: "38 Milyon", area: "9,984,670 km²", pact: "NATO, G7, BM" },
            "Spain": { trName: "İspanya Krallığı", founding: "1479", pop: "47 Milyon", area: "505,990 km²", pact: "AB, NATO" },
            "Italy": { trName: "İtalya Cumhuriyeti", founding: "1861", pop: "59 Milyon", area: "301,340 km²", pact: "AB, NATO, G7" },
            "Germany": { trName: "Almanya Federal Rep.", founding: "1871", pop: "84 Milyon", area: "357,022 km²", pact: "AB, NATO, G7" },
            "France": { trName: "Fransa Cumhuriyeti", founding: "1789", pop: "68 Milyon", area: "551,695 km²", pact: "AB, NATO, BM, G7" },
            "Iran": { trName: "İran İslam Cumhuriyeti", founding: "1979", pop: "88 Milyon", area: "1,648,195 km²", pact: "BRICS, ŞİÖ, EKO" },
            "Pakistan": { trName: "Pakistan İslam Rep.", founding: "1947", pop: "240 Milyon", area: "881,913 km²", pact: "ŞİÖ, İÖT" },
            "India": { trName: "Hindistan Cumhuriyeti", founding: "1947", pop: "1.4 Milyar", area: "3,287,263 km²", pact: "BRICS, ŞİÖ, QUAD" },
            "China": { trName: "Çin Halk Cumhuriyeti", founding: "1949", pop: "1.4 Milyar", area: "9,596,961 km²", pact: "BM, BRICS, ŞİÖ" },
            "Egypt": { trName: "Mısır Arap Cumhuriyeti", founding: "1922", pop: "110 Milyon", area: "1,010,408 km²", pact: "Arap Birliği, BRICS" }
        };

        const orgMemberships = {
            "NATO": ["Turkey", "United States", "United Kingdom", "Canada", "Spain", "Italy", "Germany", "France", "Greece", "Poland", "Norway", "Netherlands", "Belgium", "Portugal", "Denmark", "Finland", "Sweden", "Romania", "Bulgaria", "Hungary", "Czech Rep.", "Slovakia", "Albania", "Lithuania", "Latvia", "Estonia", "Croatia", "Slovenia", "Montenegro", "North Macedonia"],
            "UN": ["ALL"],
            "SCO": ["Russia", "China", "India", "Pakistan", "Iran", "Kazakhstan", "Uzbekistan", "Kyrgyzstan", "Tajikistan"],
            "BRICS": ["Brazil", "Russia", "India", "China", "South Africa", "Egypt", "Ethiopia", "Iran", "United Arab Emirates"],
            "TDT": ["Turkey", "Azerbaijan", "Kazakhstan", "Uzbekistan", "Kyrgyzstan"],
            "EU": ["Germany", "France", "Italy", "Spain", "Greece", "Poland", "Portugal", "Netherlands", "Belgium", "Austria", "Sweden", "Finland", "Denmark", "Ireland", "Czech Rep.", "Slovakia", "Hungary", "Romania", "Bulgaria", "Croatia", "Slovenia", "Estonia", "Latvia", "Lithuania", "Cyprus"],
            "ARAB": ["Egypt", "Saudi Arabia", "United Arab Emirates", "Palestine", "Iraq", "Syria", "Jordan", "Algeria", "Morocco", "Tunisia", "Libya", "Sudan", "Oman", "Yemen", "Kuwait", "Qatar", "Bahrain", "Lebanon"]
        };

        let newsData = [];
        const map = L.map('map', { center: [39.0, 35.0], zoom: 3, zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        let geojsonLayer = null;
        let worldGeoData = null;
        let currentRoleFilter = 'ALL';
        let activeOrgFilter = 'ALL';
        let currentSelectedNews = null;

        Promise.all([
            fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson').then(r => r.json()),
            fetch('newsData.json').then(r => r.json())
        ]).then(([geoData, liveNews]) => {
            worldGeoData = geoData;
            newsData = liveNews;
            renderNewsList();
        }).catch(err => {
            console.error("Veri yükleme hatası:", err);
            document.getElementById('summaryText').innerText = "Haber verileri yüklenirken bir hata oluştu.";
        });

        function renderNewsList() {
            const newsListEl = document.getElementById('newsList');
            newsListEl.innerHTML = '';

            const filteredNews = newsData.filter(news => {
                if (currentRoleFilter === 'ALL') return true;
                return Object.values(news.countries).some(c => c.role === currentRoleFilter);
            });

            filteredNews.forEach((news, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectNews(news, card);

                card.innerHTML = `
                    <h3>${news.title}</h3>
                    <div class="tags">
                        ${news.tags ? news.tags.map(t => `<span class="tag">${t}</span>`).join('') : ''}
                    </div>
                `;
                newsListEl.appendChild(card);
            });

            if (filteredNews.length > 0) {
                selectNews(filteredNews[0], newsListEl.firstChild);
            }
        }

        function selectNews(news, cardEl) {
            currentSelectedNews = news;
            
            activeOrgFilter = 'ALL';
            document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
            const defaultOrgBtn = document.getElementById('btn-org-ALL');
            if(defaultOrgBtn) defaultOrgBtn.classList.add('active');

            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
            if(cardEl) cardEl.classList.add('active');

            document.getElementById('summaryText').innerText = news.summary;
            document.getElementById('historyText').innerText = news.history;
            
            const sourceBtn = document.getElementById('sourceLink');
            sourceBtn.href = news.link;
            sourceBtn.style.display = 'block';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(news.countries)) {
                legendEl.innerHTML += `
                    <div class="legend-item" style="cursor:pointer;" onclick="showCountryCard('${code}', '${code}')">
                        <span><strong>${countryProfiles[code]?.trName || code}</strong> (${info.role})</span>
                        <span class="legend-color" style="background: ${info.color}"></span>
                    </div>
                `;
            }

            drawMap();
        }

        function drawMap() {
            if (!worldGeoData) return;
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            let highlightedBounds = L.latLngBounds();

            geojsonLayer = L.geoJson(worldGeoData, {
                style: (feature) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;

                    if (activeOrgFilter !== 'ALL') {
                        let isOrgMember = false;
                        if (activeOrgFilter === 'UN') {
                            isOrgMember = true;
                        } else {
                            const orgList = orgMemberships[activeOrgFilter] || [];
                            isOrgMember = orgList.some(k => countryName.toLowerCase().includes(k.toLowerCase()) || k.toLowerCase().includes(countryName.toLowerCase()));
                        }

                        if (isOrgMember) {
                            return { fillColor: '#0284c7', fillOpacity: 0.8, weight: 1.5, color: '#38bdf8' };
                        }
                        return { fillColor: '#0f172a', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                    }

                    let activeCountry = null;
                    if (currentSelectedNews && currentSelectedNews.countries) {
                        for (let key of Object.keys(currentSelectedNews.countries)) {
                            if (countryName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(countryName.toLowerCase())) {
                                activeCountry = currentSelectedNews.countries[key];
                                break;
                            }
                        }
                    }

                    if (activeCountry) {
                        return { fillColor: activeCountry.color, fillOpacity: 0.85, weight: 2, color: '#ffffff' };
                    }

                    return { fillColor: '#0f172a', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                },
                onEachFeature: (feature, layer) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;
                    
                    let matchedKey = null;
                    for (let key of Object.keys(countryProfiles)) {
                        if (countryName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(countryName.toLowerCase())) {
                            matchedKey = key;
                            break;
                        }
                    }

                    layer.on('click', () => showCountryCard(matchedKey || countryName, countryName));

                    if (activeOrgFilter === 'ALL' && currentSelectedNews && currentSelectedNews.countries) {
                        for (let key of Object.keys(currentSelectedNews.countries)) {
                            if (countryName.toLowerCase().includes(key.toLowerCase()) || key.toLowerCase().includes(countryName.toLowerCase())) {
                                highlightedBounds.extend(layer.getBounds());
                                layer.bindPopup(`<b>${countryProfiles[key]?.trName || countryName}</b><br>Rol: ${currentSelectedNews.countries[key].role}`);
                            }
                        }
                    }
                }
            }).addTo(map);

            if (highlightedBounds.isValid() && activeOrgFilter === 'ALL') {
                map.fitBounds(highlightedBounds, { padding: [40, 40], maxZoom: 5, animate: true });
            }
        }

        function showCountryCard(countryCode, originalName) {
            const card = document.getElementById('countryCard');
            const profile = countryProfiles[countryCode];

            if (profile) {
                document.getElementById('cardCountryName').innerText = profile.trName;
                document.getElementById('cardFounding').innerText = profile.founding;
                document.getElementById('cardPop').innerText = profile.pop;
                document.getElementById('cardArea').innerText = profile.area;
                document.getElementById('cardPact').innerText = profile.pact;
            } else {
                document.getElementById('cardCountryName').innerText = originalName || countryCode;
                document.getElementById('cardFounding').innerText = "Bölgesel Aktör";
                document.getElementById('cardPop').innerText = "Veri Ekleniyor";
                document.getElementById('cardArea').innerText = "-";
                document.getElementById('cardPact').innerText = "Uluslararası Üye";
            }
            card.style.display = 'block';
        }

        function filterRole(role) {
            currentRoleFilter = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderNewsList();
        }

        function filterOrg(org) {
            activeOrgFilter = org;
            document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-org-${org}`);
            if(activeBtn) activeBtn.classList.add('active');
            drawMap();
        }

        function switchMobileTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const sidebar = document.getElementById('sidebarSection');
            const mapSec = document.getElementById('mapSection');
            const panel = document.getElementById('panelSection');

            sidebar.classList.remove('mobile-active');
            mapSec.classList.remove('mobile-active');
            panel.classList.remove('mobile-active');

            if (tabName === 'news') {
                sidebar.classList.add('mobile-active');
            } else if (tabName === 'map') {
                mapSec.classList.add('mobile-active');
                setTimeout(() => map.invalidateSize(), 200);
            } else if (tabName === 'panel') {
                panel.classList.add('mobile-active');
            }
        }
    </script>
</body>
</html>

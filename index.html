<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KÜRESEL HAFIZA | Stratejik Jeopolitik Analiz</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background: #050811; 
            color: #f1f5f9; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        header { 
            background: rgba(10, 15, 29, 0.95); 
            backdrop-filter: blur(16px);
            padding: 12px 20px; 
            border-bottom: 2px solid #38bdf8; 
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            z-index: 1001; 
        }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem; 
            font-weight: 900; 
            color: #38bdf8; 
            letter-spacing: 2px; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(56, 189, 248, 0.6);
            cursor: pointer;
            user-select: none;
        }
        
        .radar-box {
            position: relative;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #22c55e;
            box-shadow: 0 0 12px #22c55e;
            overflow: hidden;
        }
        .radar-sweep {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: conic-gradient(from 0deg, rgba(34,197,94,0.5), transparent 60deg);
            border-radius: 50%;
            animation: sweep 2s linear infinite;
        }
        @keyframes sweep { 100% { transform: rotate(360deg); } }

        .live-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: #22c55e;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(34, 197, 94, 0.1);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(34, 197, 94, 0.4);
            cursor: pointer;
        }

        .header-controls { display: flex; flex-direction: column; gap: 8px; }
        .org-menu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .org-menu::-webkit-scrollbar { display: none; }
        
        .org-btn { 
            background: #0f172a; 
            color: #94a3b8; 
            border: 1px solid #1e293b; 
            padding: 6px 14px; 
            border-radius: 4px; 
            font-size: 0.8rem; 
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer; 
            white-space: nowrap; 
            transition: all 0.2s ease; 
            text-transform: uppercase;
        }
        .org-btn:hover { background: #1e293b; color: #fff; border-color: #38bdf8; }
        .org-btn.active { 
            background: #0284c7; 
            color: #fff; 
            border-color: #38bdf8; 
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.6);
        }

        .mobile-view-tabs { display: none; gap: 6px; background: #050811; padding: 4px; border-radius: 6px; border: 1px solid #1e293b; }
        .tab-btn { flex: 1; padding: 8px 0; border: none; background: #0f172a; color: #94a3b8; font-size: 0.85rem; font-weight: 700; cursor: pointer; border-radius: 4px; text-align: center; }
        .tab-btn.active { color: #fff; background: #0284c7; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #050811; }
        
        .sidebar { width: 360px; background: #0a0f1d; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        .role-filter-bar { padding: 10px; background: #050811; border-bottom: 1px solid #1e293b; display: flex; gap: 6px; }
        .role-btn { flex: 1; padding: 6px 2px; font-size: 0.75rem; border: none; border-radius: 3px; cursor: pointer; font-weight: 700; text-align: center; color: #fff; opacity: 0.5; transition: all 0.2s; text-transform: uppercase; }
        .role-btn.active, .role-btn:hover { opacity: 1; }
        .role-all { background: #334155; }
        .role-actor { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); }
        .role-supporter { background: #38bdf8; box-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
        .role-mediator { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }

        .news-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .news-card { 
            padding: 14px; 
            background: #0f172a; 
            border-radius: 6px; 
            border: 1px solid #1e293b; 
            cursor: pointer; 
            transition: all 0.25s ease;
            position: relative;
        }
        .news-card:hover { background: #1e293b; border-color: #38bdf8; transform: translateX(4px); }
        .news-card.active { 
            background: #1e293b; 
            border-color: #38bdf8; 
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
        }
        .news-card h3 { font-size: 0.95rem; margin-bottom: 8px; color: #f8fafc; line-height: 1.4; font-weight: 600; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.7rem; padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 700; }

        .map-container { flex: 1; position: relative; background: #050811; }
        #map { width: 100%; height: 100%; background: #050811; }

        .country-card { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            z-index: 1000; 
            background: rgba(10, 15, 29, 0.95); 
            backdrop-filter: blur(12px); 
            border: 1px solid #38bdf8; 
            border-radius: 6px; 
            padding: 16px; 
            width: 280px; 
            display: none; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); 
        }
        .country-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.05rem; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; }
        .country-info-grid { font-size: 0.82rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: #cbd5e1; }

        .info-panel { width: 380px; background: #0a0f1d; border-left: 1px solid #1e293b; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; z-index: 10; }
        .panel-block { background: #0f172a; padding: 14px; border-radius: 6px; border: 1px solid #1e293b; }
        .panel-block h4 { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: #38bdf8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .panel-block p { font-size: 0.88rem; color: #cbd5e1; line-height: 1.6; white-space: pre-line; }
        
        .history-block { 
            border-left: 4px solid #f59e0b; 
            background: rgba(245, 158, 11, 0.03);
            border-top: 1px solid rgba(245, 158, 11, 0.2);
            border-right: 1px solid rgba(245, 158, 11, 0.2);
            border-bottom: 1px solid rgba(245, 158, 11, 0.2);
        }
        .history-block h4 { color: #f59e0b; }

        .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid #1e293b; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
        
        .source-btn { 
            display: inline-block; 
            width: 100%; 
            text-align: center; 
            background: #0284c7; 
            color: #fff; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 4px; 
            font-size: 0.88rem; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.4);
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .source-btn:hover { background: #0369a1; box-shadow: 0 0 20px rgba(2, 132, 199, 0.7); }

        @media (max-width: 768px) {
            header { padding: 10px; }
            .mobile-view-tabs { display: flex; }
            .app-container { flex-direction: column; }
            
            .sidebar, .info-panel, .map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
            
            .sidebar.mobile-active { display: flex; width: 100%; }
            .map-container.mobile-active { display: block; }
            .info-panel.mobile-active { display: flex; width: 100%; border-left: none; }
            
            .country-card { top: 12px; right: 12px; left: 12px; width: auto; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="logo" onclick="window.location.reload()" title="Sayfayı Yenile">
                <div class="radar-box"><div class="radar-sweep"></div></div>
                KÜRESEL HAFIZA
            </div>
            <div class="live-tag" onclick="window.location.reload()" title="Verileri Güncelle">
                ● CANLI İSTİHBARAT AKIŞI
            </div>
        </div>
        <div class="header-controls">
            <div class="org-menu">
                <button class="org-btn active" id="btn-org-ALL" onclick="filterOrg('ALL')">Tüm Bölge</button>
                <button class="org-btn" id="btn-org-NATO" onclick="filterOrg('NATO')">NATO</button>
                <button class="org-btn" id="btn-org-UN" onclick="filterOrg('UN')">Birleşmiş Milletler (BM)</button>
                <button class="org-btn" id="btn-org-SCO" onclick="filterOrg('SCO')">Şanghay İşbirliği</button>
                <button class="org-btn" id="btn-org-BRICS" onclick="filterOrg('BRICS')">BRICS</button>
                <button class="org-btn" id="btn-org-TDT" onclick="filterOrg('TDT')">Türk Devletleri B.</button>
                <button class="org-btn" id="btn-org-EU" onclick="filterOrg('EU')">Avrupa Birliği (AB)</button>
                <button class="org-btn" id="btn-org-ARAB" onclick="filterOrg('ARAB')">Arap Birliği</button>
            </div>
            <div class="mobile-view-tabs">
                <button class="tab-btn" onclick="switchMobileTab('news')">📰 Haberler</button>
                <button class="tab-btn active" onclick="switchMobileTab('map')">🗺️ Harita</button>
                <button class="tab-btn" onclick="switchMobileTab('panel')">📊 Analiz</button>
            </div>
        </div>
    </header>

    <div class="app-container">
        <div class="sidebar" id="sidebarSection">
            <div class="role-filter-bar">
                <button class="role-btn role-all active" onclick="filterRole('ALL')">Tümü</button>
                <button class="role-btn role-actor" onclick="filterRole('Aktör')">Aktör</button>
                <button class="role-btn role-supporter" onclick="filterRole('Destekçi')">Destekçi</button>
                <button class="role-btn role-mediator" onclick="filterRole('Arabulucu')">Arabulucu</button>
            </div>
            <div class="news-list" id="newsList"></div>
        </div>

        <div class="map-container mobile-active" id="mapSection">
            <div id="map"></div>
            <div class="country-card" id="countryCard">
                <h3 id="cardCountryName">Ülke Adı</h3>
                <div class="country-info-grid">
                    <div><strong>Kuruluş:</strong> <span id="cardFounding">-</span></div>
                    <div><strong>Nüfus:</strong> <span id="cardPop">-</span></div>
                    <div><strong>Yüzölçümü:</strong> <span id="cardArea">-</span></div>
                    <div><strong>Pakt:</strong> <span id="cardPact">-</span></div>
                </div>
            </div>
        </div>

        <div class="info-panel" id="panelSection">
            <div class="panel-block">
                <h4 id="panelTitle">Saha İstihbarat Özeti</h4>
                <p id="summaryText">Lütfen bir gelişme seçin.</p>
            </div>

            <div class="panel-block">
                <h4 id="legendTitle">Olaydaki Aktörler & Konumları</h4>
                <div id="countryLegend"></div>
            </div>

            <div class="panel-block history-block">
                <h4 id="historyTitle">Tarihsel Arka Plan & Derin Hafıza</h4>
                <p id="historyText">Tarihsel arka plan yükleniyor...</p>
            </div>

            <a href="#" id="sourceLink" target="_blank" class="source-btn" style="display: none;">Kaynak Habere Git &rarr;</a>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // TAM TÜRKÇELEŞTİRİLMİŞ ÜLKE BİLGİ VERİTABANI
        const countryProfiles = {

            "Russia": { trName: "Rusya Federasyonu", founding: "1991", pop: "144 Milyon", area: "17,098,242 km²", pact: "BM, ŞİÖ, BRICS" },
            "Greece": { trName: "Yunanistan", founding: "1830", pop: "10.4 Milyon", area: "131,957 km²", pact: "AB, NATO" },

            "United Kingdom": { trName: "İngiltere (Birleşik Krallık)", founding: "1707", pop: "67 Milyon", area: "242,495 km²", pact: "NATO, BM, G7" },
            "Canada": { trName: "Kanada", founding: "1867", pop: "38 Milyon", area: "9,984,670 km²", pact: "NATO, G7, BM" },
            "Spain": { trName: "İspanya Krallığı", founding: "1479", pop: "47 Milyon", area: "505,990 km²", pact: "AB, NATO" },
            "Italy": { trName: "İtalya Cumhuriyeti", founding: "1861", pop: "59 Milyon", area: "301,340 km²", pact: "AB, NATO, G7" },
            "Germany": { trName: "Almanya Federal Rep.", founding: "1871", pop: "84 Milyon", area: "357,022 km²", pact: "AB, NATO, G7" },
            "France": { trName: "Fransa Cumhuriyeti", founding: "1789", pop: "68 Milyon", area: "551,695 km²", pact: "AB, NATO, BM, G7" },
            "Romania": { trName: "Romanya", founding: "1877", pop: "19 Milyon", area: "238,397 km²", pact: "AB, NATO" },
            "Oman": { trName: "Umman Sultanlığı", founding: "1651", pop: "4.5 Milyon", area: "309,500 km²", pact: "Arap Birliği, KİK" },
            "Iran": { trName: "İran İslam Cumhuriyeti", founding: "1979", pop: "88 Milyon", area: "1,648,195 km²", pact: "BRICS, ŞİÖ, EKO" },
            "Pakistan": { trName: "Pakistan İslam Rep.", founding: "1947", pop: "240 Milyon", area: "881,913 km²", pact: "ŞİÖ, İÖT" },
            "India": { trName: "Hindistan Cumhuriyeti", founding: "1947", pop: "1.4 Milyar", area: "3,287,263 km²", pact: "BRICS, ŞİÖ, QUAD" },
            "China": { trName: "Çin Halk Cumhuriyeti", founding: "1949", pop: "1.4 Milyar", area: "9,596,961 km²", pact: "BM, BRICS, ŞİÖ" },
            "Egypt": { trName: "Mısır Arap Cumhuriyeti", founding: "1922", pop: "110 Milyon", area: "1,010,408 km²", pact: "Arap Birliği, BRICS" }
        };

        // ÖRGÜT DETAYLI ANALİZ VERİTABANI (SAĞ PANEL İÇİN)
        const orgInfoData = {
            "NATO": {
                title: "Kuzey Atlas Antlaşması Örgütü (NATO)",
                summary: "1949 yılında kurulan askeri ve siyasi ittifak. Temel ilkesi kolektif savunmadır (Madde 5). Günümüzde 32 üye ülkeye sahiptir.",
                history: "Soğuk Savaş döneminde SSCB tehdidine karşı kurulmuş, Doğu Bloku'nun yıkılmasıyla küresel kriz yönetimi ve terörle mücadele odaklı bir yapıya dönüşmüştür. Son dönemde Doğu Avrupa kanadını tahkim etmektedir."
            },
            "UN": {
                title: "Birleşmiş Milletler (BM)",
                summary: "1945 yılında küresel barış ve güvenliği korumak amacıyla kurulan dünya örgütü. 193 üye devleti bünyesinde barındırır.",
                history: "İkinci Dünya Savaşı'nın ardından Milletler Cemiyeti'nin yerine kurulmuştur. Güvenlik Konseyi (BMGK) daimi 5 üyesinin (ABD, Rusya, Çin, İngiltere, Fransa) veto hakkı nedeniyle küresel krizlerde kritik rol oynar."
            },
            "SCO": {
                title: "Şanghay İşbirliği Örgütü (ŞİÖ)",
                summary: "Avrasya bölgesinde güvenlik, ekonomi ve kültür alanında işbirliğini hedefleyen hükümetlerarası örgüt.",
                history: "1996'da Şanghay Beşlisi olarak başladı, 2001'de kurumsallaştı. Çin ve Rusya liderliğinde Batı paktına alternatif bir Avrasya güç odağı olarak gelişmiş; Hindistan, Pakistan ve İran'ın katılımıyla küresel ağırlığı artmıştır."
            },
            "BRICS": {
                title: "BRICS Küresel Ekonomik Paktı",
                summary: "Yükselen büyük ekonomilerin küresel finans ve jeopolitik dengelerde söz sahibi olmak için oluşturduğu blok.",
                history: "Brezilya, Rusya, Hindistan, Çin ve Güney Afrika ile başlayan yapı; Mısır, İran, BAE ve Etiyopya'nın katılımıyla genişlemiş, küresel dolarsızlaşma ve alternatif finansal altyapılar üzerine odaklanmıştır."
            },
            "TDT": {
                title: "Türk Devletleri Teşkilatı (TDT)",
                summary: "Türk dili konuşan ülkeler arasında kapsamlı işbirliğini hedefleyen uluslararası örgüt.",
                history: "2009 Nahçıvan Anlaşması ile Türk Keneşi adıyla kurulmuş, 2021'de Teşkilat yapısına kavuşmuştur. Türkiye, Azerbaycan, Kazakistan, Kırgızistan ve Özbekistan tam üye; Macaristan, KKTC ve Türkmenistan gözlemcidir."
            },
            "EU": {
                title: "Avrupa Birliği (AB)",
                summary: "27 Avrupa ülkesinin siyasi ve ekonomik ortaklık yapısı. Tek pazar ve ortak para birimi (Euro) entegrasyonuna sahiptir.",
                history: "1951 Kömür ve Çelik Topluluğu'ndan 1992 Maastricht Antlaşması ile bugünkü siyasi birliğe dönüşmüştür. Küresel ticaret ve düzenlemelerde devasa bir güç bloğudur."
            },
            "ARAB": {
                title: "Arap Devletleri Ligi (Arap Birliği)",
                summary: "Arap coğrafyasındaki 22 üye ülkenin bölgesel işbirliği örgütü.",
                history: "1945'te Kahire'de kurulmuştur. Üye ülkeler arasında siyasi, ekonomik ve askeri koordinasyonu hedefler. Orta Doğu krizlerinde bölgesel bir platformdur."
            }
        };

        const orgMemberships = {
            "NATO": ["Turkey", "United States", "United Kingdom", "Canada", "Spain", "Italy", "Germany", "France", "Greece", "Romania", "Poland", "Norway", "Netherlands", "Belgium", "Portugal", "Denmark", "Finland", "Sweden", "Bulgaria", "Hungary", "Slovakia", "Albania", "Lithuania", "Latvia", "Estonia", "Croatia", "Slovenia", "Montenegro", "North Macedonia"],
            "UN": ["ALL"],
            "SCO": ["Russia", "China", "India", "Pakistan", "Iran", "Kazakhstan", "Uzbekistan", "Kyrgyzstan", "Tajikistan"],
            "BRICS": ["Brazil", "Russia", "India", "China", "South Africa", "Egypt", "Ethiopia", "Iran", "United Arab Emirates"],
            "TDT": ["Turkey", "Azerbaijan", "Kazakhstan", "Uzbekistan", "Kyrgyzstan"],
            "EU": ["Germany", "France", "Italy", "Spain", "Greece", "Romania", "Poland", "Portugal", "Netherlands", "Belgium", "Austria", "Sweden", "Finland", "Denmark", "Ireland", "Slovakia", "Hungary", "Bulgaria", "Croatia", "Slovenia", "Estonia", "Latvia", "Lithuania", "Cyprus"],
            "ARAB": ["Egypt", "Saudi Arabia", "United Arab Emirates", "Palestine", "Iraq", "Syria", "Jordan", "Algeria", "Morocco", "Tunisia", "Libya", "Sudan", "Oman", "Yemen", "Kuwait", "Qatar", "Bahrain", "Lebanon"]
        };

        let newsData = [];
        const map = L.map('map', { center: [39.0, 35.0], zoom: 3, zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        let geojsonLayer = null;
        let worldGeoData = null;
        let currentRoleFilter = 'ALL';
        let activeOrgFilter = 'ALL';
        let currentSelectedNews = null;

        Promise.all([
            fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson').then(r => r.json()),
            fetch('newsData.json').then(r => r.json())
        ]).then(([geoData, liveNews]) => {
            worldGeoData = geoData;
            newsData = liveNews;
            renderNewsList();
        }).catch(err => {
            console.error("Veri yükleme hatası:", err);
            document.getElementById('summaryText').innerText = "Haber verileri yüklenirken bir hata oluştu.";
        });

        function renderNewsList() {
            const newsListEl = document.getElementById('newsList');
            newsListEl.innerHTML = '';

            const filteredNews = newsData.filter(news => {
                if (currentRoleFilter === 'ALL') return true;
                return Object.values(news.countries).some(c => c.role === currentRoleFilter);
            });

            filteredNews.forEach((news, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectNews(news, card);

                card.innerHTML = `
                    <h3>${news.title}</h3>
                    <div class="tags">
                        ${news.tags ? news.tags.map(t => `<span class="tag">${t}</span>`).join('') : ''}
                    </div>
                `;
                newsListEl.appendChild(card);
            });

            if (filteredNews.length > 0) {
                selectNews(filteredNews[0], newsListEl.firstChild);
            }
        }

        function selectNews(news, cardEl) {
            currentSelectedNews = news;
            
            activeOrgFilter = 'ALL';
            document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
            const defaultOrgBtn = document.getElementById('btn-org-ALL');
            if(defaultOrgBtn) defaultOrgBtn.classList.add('active');

            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
            if(cardEl) cardEl.classList.add('active');

            document.getElementById('panelTitle').innerText = "Saha İstihbarat Özeti";
            document.getElementById('legendTitle').innerText = "Olaydaki Aktörler & Konumları";
            document.getElementById('historyTitle').innerText = "Tarihsel Arka Plan & Derin Hafıza";

            document.getElementById('summaryText').innerText = news.summary;
            document.getElementById('historyText').innerText = news.history;
            
            const sourceBtn = document.getElementById('sourceLink');
            sourceBtn.href = news.link;
            sourceBtn.style.display = 'block';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(news.countries)) {
                legendEl.innerHTML += `
                    <div class="legend-item" style="cursor:pointer;" onclick="showCountryCard('${code}', '${code}')">
                        <span><strong>${countryProfiles[code]?.trName || code}</strong> (${info.role})</span>
                        <span class="legend-color" style="background: ${info.color}"></span>
                    </div>
                `;
            }

            drawMap();
        }

        function checkExactMembership(countryName, targetList) {
            const nameLower = countryName.toLowerCase().trim();
            return targetList.some(member => {
                const memberLower = member.toLowerCase().trim();
                if (nameLower === memberLower) return true;
                if (nameLower.startsWith(memberLower + " ") || nameLower.endsWith(" " + memberLower)) return true;
                if (memberLower === "romania" && nameLower.includes("romania")) return true;
                if (memberLower === "oman" && (nameLower === "oman" || nameLower === "sultanate of oman")) return true;
                return false;
            });
        }

        function drawMap() {
            if (!worldGeoData) return;
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            let highlightedBounds = L.latLngBounds();

            geojsonLayer = L.geoJson(worldGeoData, {
                style: (feature) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;

                    if (activeOrgFilter !== 'ALL') {
                        let isOrgMember = false;
                        if (activeOrgFilter === 'UN') {
                            isOrgMember = true;
                        } else {
                            const orgList = orgMemberships[activeOrgFilter] || [];
                            isOrgMember = checkExactMembership(countryName, orgList);
                        }

                        if (isOrgMember) {
                            return { fillColor: '#0284c7', fillOpacity: 0.85, weight: 1.5, color: '#38bdf8' };
                        }
                        return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                    }

                    let activeCountry = null;
                    if (currentSelectedNews && currentSelectedNews.countries) {
                        for (let key of Object.keys(currentSelectedNews.countries)) {
                            if (checkExactMembership(countryName, [key])) {
                                activeCountry = currentSelectedNews.countries[key];
                                break;
                            }
                        }
                    }

                    if (activeCountry) {
                        return { fillColor: activeCountry.color, fillOpacity: 0.85, weight: 2, color: '#ffffff' };
                    }

                    return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                },
                onEachFeature: (feature, layer) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;
                    
                    let matchedKey = null;
                    for (let key of Object.keys(countryProfiles)) {
                        if (checkExactMembership(countryName, [key])) {
                            matchedKey = key;
                            break;
                        }
                    }

                    layer.on('click', () => showCountryCard(matchedKey || countryName, countryName));

                    if (activeOrgFilter === 'ALL' && currentSelectedNews && currentSelectedNews.countries) {
                        for (let key of Object.keys(currentSelectedNews.countries)) {
                            if (checkExactMembership(countryName, [key])) {
                                highlightedBounds.extend(layer.getBounds());
                                layer.bindPopup(`<b>${countryProfiles[key]?.trName || countryName}</b><br>Rol: ${currentSelectedNews.countries[key].role}`);
                            }
                        }
                    }
                }
            }).addTo(map);

            if (highlightedBounds.isValid() && activeOrgFilter === 'ALL') {
                map.fitBounds(highlightedBounds, { padding: [40, 40], maxZoom: 5, animate: true });
            }
        }

        function showCountryCard(countryCode, originalName) {
            const card = document.getElementById('countryCard');
            const profile = countryProfiles[countryCode];

            if (profile) {
                document.getElementById('cardCountryName').innerText = profile.trName;
                document.getElementById('cardFounding').innerText = profile.founding;
                document.getElementById('cardPop').innerText = profile.pop;
                document.getElementById('cardArea').innerText = profile.area;
                document.getElementById('cardPact').innerText = profile.pact;
            } else {
                document.getElementById('cardCountryName').innerText = originalName || countryCode;
                document.getElementById('cardFounding').innerText = "Bölgesel Aktör";
                document.getElementById('cardPop').innerText = "Veri Ekleniyor";
                document.getElementById('cardArea').innerText = "-";
                document.getElementById('cardPact').innerText = "Uluslararası Üye";
            }
            card.style.display = 'block';
        }

        function filterRole(role) {
            currentRoleFilter = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderNewsList();
        }

        // ÖRGÜT SEÇİLDİĞİNDE SAĞ PANELYİ DOLDUR
        function filterOrg(org) {
            activeOrgFilter = org;
            document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-org-${org}`);
            if(activeBtn) activeBtn.classList.add('active');

            if (org !== 'ALL' && orgInfoData[org]) {
                const info = orgInfoData[org];
                document.getElementById('panelTitle').innerText = "Örgüt Analizi";
                document.getElementById('legendTitle').innerText = "Üye Ülke Sayısı";
                document.getElementById('historyTitle').innerText = "Stratejik & Tarihsel Rolü";

                document.getElementById('summaryText').innerText = info.summary;
                document.getElementById('historyText').innerText = info.history;
                
                const legendEl = document.getElementById('countryLegend');
                const memberCount = org === 'UN' ? "193 Üye Ülke" : `${(orgMemberships[org] || []).length} Üye Ülke`;
                legendEl.innerHTML = `<div class="legend-item"><span><strong>${info.title}</strong></span><span class="legend-color" style="background:#0284c7;"></span></div><div class="legend-item"><span>Kapsam: ${memberCount}</span></div>`;
                
                document.getElementById('sourceLink').style.display = 'none';
            }

            drawMap();
        }

        function switchMobileTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const sidebar = document.getElementById('sidebarSection');
            const mapSec = document.getElementById('mapSection');
            const panel = document.getElementById('panelSection');

            sidebar.classList.remove('mobile-active');
            mapSec.classList.remove('mobile-active');
            panel.classList.remove('mobile-active');

            if (tabName === 'news') {
                sidebar.classList.add('mobile-active');
            } else if (tabName === 'map') {
                mapSec.classList.add('mobile-active');
                setTimeout(() => map.invalidateSize(), 200);
            } else if (tabName === 'panel') {
                panel.classList.add('mobile-active');
            }
        }
    </script>
</body>
</html>

        .live-tag { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #22c55e; font-weight: 700; letter-spacing: 1px; background: rgba(34, 197, 94, 0.1); padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(34, 197, 94, 0.4); cursor: pointer; }

        .tab-btn.active { color: #fff; background: #0284c7; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #02040a; }
        
        /* FERAH SOL MENÜ */
        .sidebar { width: 340px; background: #0a0f1d; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        
        .search-box { padding: 12px; background: #050811; border-bottom: 1px solid #1e293b; }
        .search-box input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #38bdf8; color: #f1f5f9; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; }
        
        .tag-search-info { display: none; padding: 8px 12px; background: rgba(56, 189, 248, 0.1); border-bottom: 1px solid rgba(56, 189, 248, 0.2); font-size: 0.78rem; color: #38bdf8; justify-content: space-between; align-items: center; }
        .clear-tag-btn { background: #ef4444; color: #fff; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }

        .news-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .news-card { padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #1e293b; cursor: pointer; transition: all 0.2s ease; }
        .news-card:hover, .news-card.active { background: #1e293b; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }

        .news-card p.sub { font-size: 0.78rem; color: #94a3b8; }
        
        .tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.68rem; padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 700; }

            .sidebar, .info-panel, .globe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
            .sidebar.mobile-active { display: flex; width: 100%; }

            .arcDashLength(0.5)
            .arcDashGap(0.2)
            .arcDashAnimateTime(1200)
            .arcStroke(1.5)
            .arcAltitude(0.25)
            // 3D BAŞKENT NOKTALARI
            .pointColor('color')
            .pointAltitude(0.06)
            .pointRadius(0.8);

        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.4;

        document.getElementById('globeViz').addEventListener('mousedown', () => {
            globe.controls().autoRotate = false;
        });

        Promise.all([
            fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson').then(r => r.json()),
            fetch('newsData.json').then(r => r.json())
        ]).then(([geoData, liveNews]) => {
            worldGeoJson = geoData;
            newsData = liveNews;
            globe.polygonsData(geoData.features);
            switchMainMode('news');
        }).catch(err => console.error("Veri Yükleme Hatası:", err));

        function switchMainMode(mode) {
            currentMainMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-mode-${mode}`);
            if(activeBtn) activeBtn.classList.add('active');

            if (mode === 'news') document.getElementById('searchBoxContainer').style.display = 'block';
            else document.getElementById('searchBoxContainer').style.display = 'none';

            executeSearch();
        }

        function executeSearch() {
            const listEl = document.getElementById('sidebarContentList');
            listEl.innerHTML = '';
            
            let dataSource = [];
            if(currentMainMode === 'news') dataSource = newsData;
            else if(currentMainMode === 'orgs') dataSource = orgListData;
            else if(currentMainMode === 'conflicts') dataSource = conflictListData;

            const searchInput = document.getElementById('newsSearchInput');
            const searchText = searchInput ? toTRLowerCase(searchInput.value.trim()) : "";

            const filteredData = dataSource.filter(item => {
                let tagMatch = true;
                if (currentMainMode === 'news' && selectedTagFilter) {
                    const cleanSelected = toTRLowerCase(selectedTagFilter.replace('#', '').trim());
                    tagMatch = item.tags && item.tags.some(t => toTRLowerCase(t.replace('#', '').trim()).includes(cleanSelected));
                }

                let searchMatch = true;
                if (searchText) {
                    const titleMatch = toTRLowerCase(item.title || "").includes(searchText);
                    const summaryMatch = toTRLowerCase(item.summary || item.sub || "").includes(searchText);
                    let tagsMatch = item.tags ? item.tags.some(t => toTRLowerCase(t).includes(searchText)) : false;
                    searchMatch = titleMatch || summaryMatch || tagsMatch;
                }

                return tagMatch && searchMatch;
            });

            filteredData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                
                if (currentMainMode === 'news') {
                    card.onclick = () => selectNews(item, card);
                    const tagsHtml = item.tags ? item.tags.map(t => `<span class="tag" onclick="filterByTag('${t}', event)">${t}</span>`).join('') : '';
                    card.innerHTML = `<h3>${item.title}</h3><div class="tags">${tagsHtml}</div>`;
                } else if (currentMainMode === 'orgs') {
                    card.onclick = () => selectOrg(item.id, card);
                    card.innerHTML = `<h3>${item.title}</h3><p class="sub">${item.sub}</p>`;
                } else if (currentMainMode === 'conflicts') {
                    card.onclick = () => selectConflict(item, card);
                    card.innerHTML = `<h3>${item.title}</h3><p class="sub">${item.sub}</p>`;
                }
                
                listEl.appendChild(card);
            });

            if (filteredData.length > 0) {
                if (currentMainMode === 'news') selectNews(filteredData[0], listEl.firstChild);
                else if (currentMainMode === 'orgs') selectOrg(filteredData[0].id, listEl.firstChild);
                else if (currentMainMode === 'conflicts') selectConflict(filteredData[0], listEl.firstChild);
            } else {
                document.getElementById('summaryText').innerText = "Arama kriterinize uygun sonuç bulunamadı.";
            }
        }

        function filterByTag(tagName, event) {
            if(event) event.stopPropagation();
            selectedTagFilter = tagName;
            document.getElementById('activeTagText').innerText = tagName;
            document.getElementById('tagSearchInfo').style.display = 'flex';
            if (currentMainMode !== 'news') switchMainMode('news');
            else executeSearch();
        }

        function clearTagFilter() {
            selectedTagFilter = null;
            document.getElementById('tagSearchInfo').style.display = 'none';
            executeSearch();
        }

        function selectNews(news, cardEl) {
            currentActiveItem = { type: 'news', data: news };
            highlightCard(cardEl);

            document.getElementById('panelTitle').innerText = "Saha İstihbarat Özeti";
            document.getElementById('legendTitle').innerText = "Olaydaki Aktörler & Konumları";
            document.getElementById('historyTitle').innerText = "Tarihsel Arka Plan & Derin Hafıza";
            document.getElementById('summaryText').innerText = news.summary;
            document.getElementById('historyText').innerText = news.history;
            
            const sourceBtn = document.getElementById('sourceLink');
            sourceBtn.href = news.link;
            sourceBtn.style.display = 'block';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(news.countries)) {
                const matchedMaster = findMasterCountry(code);
                const turkishName = matchedMaster ? matchedMaster.trName : code;
                legendEl.innerHTML += `
                    <div class="legend-item">
                        <span><strong>${turkishName}</strong><br><small style="color:#94a3b8">${info.role}</small></span>
                        <span class="legend-color" style="background: ${info.color};"></span>
                    </div>
                `;
            }
            update3DGlobe();
        }

        function selectOrg(orgId, cardEl) {
            currentActiveItem = { type: 'org', id: orgId };
            highlightCard(cardEl);

            const info = orgInfoData[orgId] || { title: orgId, summary: "Örgüt özeti yükleniyor...", history: "Tarihsel süreç yükleniyor...", membersEn: [] };
            document.getElementById('panelTitle').innerText = "Örgüt Doktrini & Özeti";
            document.getElementById('legendTitle').innerText = "Üye Ülkeler Listesi";
            document.getElementById('historyTitle').innerText = "Stratejik & Tarihsel Rolü";

            document.getElementById('summaryText').innerText = info.summary;
            document.getElementById('historyText').innerText = info.history;
            document.getElementById('sourceLink').style.display = 'none';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = `<div class="legend-item"><span><strong>${info.title}</strong></span><span class="legend-color" style="background:#0284c7;"></span></div>`;
            update3DGlobe();
        }

        function selectConflict(conf, cardEl) {
            currentActiveItem = { type: 'conflict', data: conf };
            highlightCard(cardEl);

            document.getElementById('panelTitle').innerText = "Çatışma Analiz Özeti";
            document.getElementById('legendTitle').innerText = "Taraf Ülkeler & Rolleri";
            document.getElementById('historyTitle').innerText = "Stratejik Arka Plan & Derin Hafıza";

            document.getElementById('summaryText').innerText = conf.summary;
            document.getElementById('historyText').innerText = conf.history;
            document.getElementById('sourceLink').style.display = 'none';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(conf.countries)) {
                const matchedMaster = findMasterCountry(code);
                const turkishName = matchedMaster ? matchedMaster.trName : code;
                legendEl.innerHTML += `
                    <div class="legend-item">
                        <span><strong>${turkishName}</strong><br><small style="color:#94a3b8">${info.role}</small></span>
                        <span class="legend-color" style="background: ${info.color};"></span>
                    </div>
                `;
            }
            update3DGlobe();
        }

        function highlightCard(cardEl) {
            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
            if(cardEl) cardEl.classList.add('active');
        }

        // ESNEK MÜKEMMEL ÜLKE BULUCU FONKSİYON
        function findMasterCountry(queryName) {
            if (!queryName) return null;
            const q = toTRLowerCase(queryName.trim());
            for (let [standardName, data] of Object.entries(countryMasterDict)) {
                if (data.keys.some(k => q.includes(k) || k.includes(q))) {
                    return { key: standardName, ...data };
                }
            }
            return null;
        }

        // 3D GÜNCELLEME MOTORU (RENK + BAĞLANTI ÇİZGİSİ)
        function update3DGlobe() {
            if (!worldGeoJson || !currentActiveItem) return;

            const arcsData = [];
            const pointsData = [];
            let activeCountriesDict = {};

            if (currentActiveItem.type === 'news' || currentActiveItem.type === 'conflict') {
                const rawCountries = currentActiveItem.data.countries || {};
                
                // Ülkeleri eşleştirip koordinatlarını al
                const validActors = [];
                for (let [code, info] of Object.entries(rawCountries)) {
                    const matched = findMasterCountry(code);
                    if (matched) {
                        validActors.push({ masterKey: matched.key, info: info, coords: matched });
                        activeCountriesDict[matched.key] = info.color;
                    }
                }

                // Her aktörün başkentine 3D Işık Noktası Koy
                validActors.forEach(act => {
                    pointsData.push({
                        lat: act.coords.lat,
                        lng: act.coords.lng,
                        color: act.info.color || '#38bdf8'
                    });
                });

                // Aktörler arasında 3D Işıklı Bağlantı Yayları Çek
                for (let i = 0; i < validActors.length; i++) {
                    for (let j = i + 1; j < validActors.length; j++) {
                        arcsData.push({
                            startLat: validActors[i].coords.lat,
                            startLng: validActors[i].coords.lng,
                            endLat: validActors[j].coords.lat,
                            endLng: validActors[j].coords.lng,
                            color: [validActors[i].info.color || '#38bdf8', validActors[j].info.color || '#ef4444']
                        });
                    }
                }

                if (validActors.length > 0) {
                    globe.pointOfView({ lat: validActors[0].coords.lat, lng: validActors[0].coords.lng, altitude: 1.8 }, 1500);
                }
            } else if (currentActiveItem.type === 'org') {
                const orgId = currentActiveItem.id;
                const orgInfo = orgInfoData[orgId];
                if (orgInfo && orgInfo.center) {
                    const centerMaster = findMasterCountry(orgInfo.center);
                    if (centerMaster) {
                        orgInfo.membersEn.forEach(mem => {
                            const memMaster = findMasterCountry(mem);
                            if (memMaster) {
                                activeCountriesDict[memMaster.key] = '#0284c7';
                                if (memMaster.key !== centerMaster.key) {
                                    arcsData.push({
                                        startLat: centerMaster.lat,
                                        startLng: centerMaster.lng,
                                        endLat: memMaster.lat,
                                        endLng: memMaster.lng,
                                        color: ['#0284c7', '#38bdf8']
                                    });
                                }
                            }
                        });
                        globe.pointOfView({ lat: centerMaster.lat, lng: centerMaster.lng, altitude: 2.0 }, 1500);
                    }
                }
            }

            // Poligon Renklendirme (Tüm Ülke Karasını Kaplar)
            worldGeoJson.features.forEach(f => {
                const geoName = f.properties.name || f.properties.ADMIN || "";
                const matchedGeoMaster = findMasterCountry(geoName);
                
                let colorToApply = null;
                if (matchedGeoMaster && activeCountriesDict[matchedGeoMaster.key]) {
                    colorToApply = activeCountriesDict[matchedGeoMaster.key];
                }

                f.properties.customColor = colorToApply ? `${colorToApply}dd` : 'rgba(10, 15, 29, 0.25)';
            });

            globe.polygonsData(worldGeoJson.features);
            globe.arcsData(arcsData);
            globe.pointsData(pointsData);
        }

        function switchMobileTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const sidebar = document.getElementById('sidebarSection');
            const mapSec = document.getElementById('mapSection');
            const panel = document.getElementById('panelSection');

            sidebar.classList.remove('mobile-active');
            mapSec.classList.remove('mobile-active');
            panel.classList.remove('mobile-active');

            if (tabName === 'news') sidebar.classList.add('mobile-active');
            else if (tabName === 'map') mapSec.classList.add('mobile-active');
            else if (tabName === 'panel') panel.classList.add('mobile-active');
        }
    </script>
</body>
</html>

            "NATO": ["Turkey", "United States", "United Kingdom", "Canada", "Spain", "Italy", "Germany", "France", "Greece", "Romania", "Poland", "Norway", "Netherlands", "Belgium", "Portugal", "Denmark", "Finland", "Sweden", "Bulgaria", "Hungary", "Slovakia", "Albania", "Lithuania", "Letonya", "Estonia", "Croatia", "Slovenia", "Montenegro", "North Macedonia"],
            "UN": ["ALL"],
            "SCO": ["Russia", "China", "India", "Pakistan", "Iran", "Kazakhstan", "Uzbekistan", "Kyrgyzstan", "Tajikistan", "Belarus"],
            "BRICS": ["Brazil", "Russia", "India", "China", "South Africa", "Egypt", "Ethiopia", "Iran", "United Arab Emirates"],
            "TDT": ["Turkey", "Azerbaijan", "Kazakhstan", "Uzbekistan", "Kyrgyzstan", "Hungary"],
            "EU": ["Germany", "France", "Italy", "Spain", "Greece", "Romania", "Poland", "Portugal", "Netherlands", "Belgium", "Austria", "Sweden", "Finland", "Denmark", "Ireland", "Slovakia", "Hungary", "Bulgaria", "Croatia", "Slovenia", "Estonia", "Latvia", "Lithuania", "Cyprus"],
            "ARAB": ["Egypt", "Saudi Arabia", "United Arab Emirates", "Palestine", "Iraq", "Syria", "Jordan", "Algeria", "Morocco", "Tunisia", "Libya", "Sudan", "Oman", "Yemen", "Kuwait", "Qatar", "Bahrain", "Lebanon"]
        };

        let newsData = [];
        let selectedTagFilter = null;
        const map = L.map('map', { center: [30.0, 15.0], zoom: 2, zoomControl: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        let geojsonLayer = null;
        let worldGeoData = null;
        let activeOrgFilter = 'ALL';
        let currentSelectedNews = null;

        Promise.all([
            fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson').then(r => r.json()),
            fetch('newsData.json').then(r => r.json())
        ]).then(([geoData, liveNews]) => {
            worldGeoData = geoData;
            newsData = liveNews;
            renderNewsList();
        }).catch(err => {
            console.error("Veri yükleme hatası:", err);
            document.getElementById('summaryText').innerText = "Haber verileri yüklenirken bir hata oluştu.";
        });

        function renderNewsList() {
            const newsListEl = document.getElementById('newsList');
            newsListEl.innerHTML = '';

            const filteredNews = newsData.filter(news => {
                if (!selectedTagFilter) return true;
                const cleanSelected = selectedTagFilter.toLowerCase().replace('#', '').trim();
                return news.tags && news.tags.some(t => {
                    const cleanTag = t.toLowerCase().replace('#', '').trim();
                    return cleanTag.includes(cleanSelected) || cleanSelected.includes(cleanTag);
                });
            });

            filteredNews.forEach((news, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectNews(news, card);

                const tagsHtml = news.tags ? news.tags.map(t => `<span class="tag" onclick="filterByTag('${t}', event)">${t}</span>`).join('') : '';

                card.innerHTML = `
                    <h3>${news.title}</h3>
                    <div class="tags">${tagsHtml}</div>
                `;
                newsListEl.appendChild(card);
            });

            if (filteredNews.length > 0) {
                selectNews(filteredNews[0], newsListEl.firstChild);
            } else {
                document.getElementById('summaryText').innerText = "Bu etikete uygun haber bulunamadı.";
            }
        }

        // ETİKETE TIKLAYINCA ARAMA/FİLTRELEME FONKSİYONU
        function filterByTag(tagName, event) {
            if(event) event.stopPropagation(); // Kart tıklamasını engelle
            selectedTagFilter = tagName;
            document.getElementById('activeTagText').innerText = tagName;
            document.getElementById('tagSearchInfo').style.display = 'flex';
            renderNewsList();
        }

        function clearTagFilter() {
            selectedTagFilter = null;
            document.getElementById('tagSearchInfo').style.display = 'none';
            renderNewsList();
        }

        function selectNews(news, cardEl) {
            currentSelectedNews = news;
            
            activeOrgFilter = 'ALL';
            document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
            const defaultOrgBtn = document.getElementById('btn-org-ALL');
            if(defaultOrgBtn) defaultOrgBtn.classList.add('active');

            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
            if(cardEl) cardEl.classList.add('active');

            document.getElementById('panelTitle').innerText = "Saha İstihbarat Özeti";
            document.getElementById('legendTitle').innerText = "Olaydaki Aktörler & Konumları";
            document.getElementById('historyTitle').innerText = "Tarihsel Arka Plan & Derin Hafıza";

            document.getElementById('summaryText').innerText = news.summary;
            document.getElementById('historyText').innerText = news.history;
            
            const sourceBtn = document.getElementById('sourceLink');
            sourceBtn.href = news.link;
            sourceBtn.style.display = 'block';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(news.countries)) {
                const turkishName = countryProfiles[code]?.trName || trNameDict[code] || code;
                legendEl.innerHTML += `
                    <div class="legend-item" style="cursor:pointer;" onclick="showCountryCard('${code}', '${code}')">
                        <span><strong>${turkishName}</strong> (${info.role})</span>
                        <span class="legend-color" style="background: ${info.color}"></span>
                    </div>
                `;
            }

            drawMap();
        }

        function checkExactMembership(countryName, targetList) {
            const nameLower = countryName.toLowerCase().trim();
            return targetList.some(member => {
                const memberLower = member.toLowerCase().trim();
                if (nameLower === memberLower) return true;
                if (nameLower.startsWith(memberLower + " ") || nameLower.endsWith(" " + memberLower)) return true;
                if (memberLower === "romania" && nameLower.includes("romania")) return true;
                if (memberLower === "oman" && (nameLower === "oman" || nameLower === "sultanate of oman")) return true;
                return false;
            });
        }

        function drawMap() {
            if (!worldGeoData) return;
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            let highlightedBounds = L.latLngBounds();

            geojsonLayer = L.geoJson(worldGeoData, {
                style: (feature) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;

                    if (activeOrgFilter !== 'ALL') {
                        let isOrgMember = false;
                        if (activeOrgFilter === 'UN') {
                            isOrgMember = true;
                        } else {
                            const orgList = orgMemberships[activeOrgFilter] || [];
                            isOrgMember = checkExactMembership(countryName, orgList);
                        }

                        if (isOrgMember) {
                            return { fillColor: '#0284c7', fillOpacity: 0.85, weight: 1.5, color: '#38bdf8' };
                        }
                        return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                    }

                    let activeCountry = null;
                    if (currentSelectedNews && currentSelectedNews.countries) {
                        for (let key of Object.keys(currentSelectedNews.countries)) {
                            if (checkExactMembership(countryName, [key])) {
                                activeCountry = currentSelectedNews.countries[key];
                                break;
                            }
                        }
                    }

                    if (activeCountry) {
                        return { fillColor: activeCountry.color, fillOpacity: 0.85, weight: 2, color: '#ffffff' };
                    }

                    return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                },
                onEachFeature: (feature, layer) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;
                    
                    let matchedKey = null;
                    for (let key of Object.keys(countryProfiles)) {
                        if (checkExactMembership(countryName, [key])) {
                            matchedKey = key;
                            break;
                        }
                    }

                    layer.on('click', () => showCountryCard(matchedKey || countryName, countryName));

                    if (activeOrgFilter !== 'ALL') {
                        if (activeOrgFilter === 'UN' || checkExactMembership(countryName, orgMemberships[activeOrgFilter] || [])) {
                            highlightedBounds.extend(layer.getBounds());
                        }
                    } else if (currentSelectedNews && currentSelectedNews.countries) {
                        for (let key of Object.keys(currentSelectedNews.countries)) {
                            if (checkExactMembership(countryName, [key])) {
                                highlightedBounds.extend(layer.getBounds());
                                const turkishName = countryProfiles[key]?.trName || trNameDict[countryName] || countryName;
                                layer.bindPopup(`<b>${turkishName}</b><br>Rol: ${currentSelectedNews.countries[key].role}`);
                            }
                        }
                    }
                }
            }).addTo(map);

            // GÜVENLİ VE AKILLI ZOOM (FIT BOUNDS)
            if (activeOrgFilter === 'UN') {
                map.setView([20.0, 0.0], 2, { animate: true });
            } else if (highlightedBounds.isValid()) {
                map.fitBounds(highlightedBounds, { padding: [40, 40], maxZoom: 4, animate: true });
            }
        }

        // AKILLI %100 TÜRKÇE ÜLKE KARTI
        function showCountryCard(countryCode, originalName) {
            const card = document.getElementById('countryCard');
            const profile = countryProfiles[countryCode];
            const cleanTurkishName = profile?.trName || trNameDict[originalName] || trNameDict[countryCode] || originalName || countryCode;

            if (profile) {
                document.getElementById('cardCountryName').innerText = profile.trName;
                document.getElementById('cardFounding').innerText = profile.founding;
                document.getElementById('cardPop').innerText = profile.pop;
                document.getElementById('cardArea').innerText = profile.area;
                document.getElementById('cardPact').innerText = profile.pact;
            } else {
                document.getElementById('cardCountryName').innerText = cleanTurkishName;
                document.getElementById('cardFounding').innerText = "Egemen Devlet";
                document.getElementById('cardPop').innerText = "BM Üyesi Devlet";
                document.getElementById('cardArea').innerText = "Bölgesel Veri";
                document.getElementById('cardPact').innerText = "Uluslararası Aktör";
            }
            card.style.display = 'block';
        }

        function filterOrg(org) {
            activeOrgFilter = org;
            document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-org-${org}`);
            if(activeBtn) activeBtn.classList.add('active');

            if (org !== 'ALL' && orgInfoData[org]) {
                const info = orgInfoData[org];
                document.getElementById('panelTitle').innerText = "Örgüt Analizi";
                document.getElementById('legendTitle').innerText = "Üye Ülkeler Listesi";
                document.getElementById('historyTitle').innerText = "Doktrin & Tarihsel Rolü";

                document.getElementById('summaryText').innerText = info.summary;
                document.getElementById('historyText').innerText = info.history;
                
                const legendEl = document.getElementById('countryLegend');
                const memberChipsHtml = info.membersTr.map(m => `<span class="member-chip">${m}</span>`).join('');
                
                legendEl.innerHTML = `
                    <div class="legend-item">
                        <span><strong>${info.title}</strong></span>
                        <span class="legend-color" style="background:#0284c7;"></span>
                    </div>
                    <div class="member-chips">
                        ${memberChipsHtml}
                    </div>
                `;
                
                document.getElementById('sourceLink').style.display = 'none';
            }

            drawMap();
        }

        function switchMobileTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const sidebar = document.getElementById('sidebarSection');
            const mapSec = document.getElementById('mapSection');
            const panel = document.getElementById('panelSection');

            sidebar.classList.remove('mobile-active');
            mapSec.classList.remove('mobile-active');
            panel.classList.remove('mobile-active');

            if (tabName === 'news') {
                sidebar.classList.add('mobile-active');
            } else if (tabName === 'map') {
                mapSec.classList.add('mobile-active');
                setTimeout(() => map.invalidateSize(), 200);
            } else if (tabName === 'panel') {
                panel.classList.add('mobile-active');
            }
        }
    </script>
</body>
</html>

        header { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(16px); padding: 10px 16px; border-bottom: 2px solid #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25); display: flex; flex-direction: column; gap: 8px; z-index: 1001; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { font-family: 'Syne', 'Rajdhani', sans-serif; font-size: 1.2rem; font-weight: 800; color: #38bdf8; letter-spacing: 1.2px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; text-shadow: 0 0 18px rgba(56, 189, 248, 0.6); cursor: pointer; user-select: none; }
        
        .radar-box { position: relative; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #22c55e; box-shadow: 0 0 12px #22c55e; overflow: hidden; }
        .radar-sweep { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: conic-gradient(from 0deg, rgba(34,197,94,0.5), transparent 60deg); border-radius: 50%; animation: sweep 2s linear infinite; }
        @keyframes sweep { 100% { transform: rotate(360deg); } }

        .live-tag { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: #22c55e; font-weight: 700; letter-spacing: 1px; background: rgba(34, 197, 94, 0.1); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(34, 197, 94, 0.4); }

        .header-controls { display: flex; flex-direction: column; gap: 8px; }
        .org-menu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .org-menu::-webkit-scrollbar { display: none; }
        .mode-btn { background: #0f172a; color: #94a3b8; border: 1px solid #1e293b; padding: 6px 14px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .mode-btn:hover { background: #1e293b; color: #fff; border-color: #38bdf8; }
        .mode-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 15px rgba(2, 132, 199, 0.6); }

        /* MOBİL SEKME BUTONLARI */
        .mobile-tabs { display: none; background: #050811; border-bottom: 1px solid #1e293b; padding: 6px 10px; gap: 6px; }
        .tab-btn { flex: 1; padding: 8px; background: #0f172a; border: 1px solid #1e293b; color: #94a3b8; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #02040a; width: 100%; height: 100%; }
        
        .sidebar { width: 340px; min-width: 340px; background: #0a0f1d; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; position: relative; }
        
        .search-box { padding: 10px; background: #050811; border-bottom: 1px solid #1e293b; }
        .search-box input { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid #38bdf8; color: #f1f5f9; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.82rem; outline: none; }
        
        .news-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .news-card { padding: 12px; background: #0f172a; border-radius: 6px; border: 1px solid #1e293b; cursor: pointer; transition: all 0.2s ease; }
        .news-card:hover, .news-card.active { background: #1e293b; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }

        .news-card p.sub { font-size: 0.75rem; color: #94a3b8; }
        
        .scroll-indicator { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(56, 189, 248, 0.9); color: #02040a; font-size: 0.7rem; font-weight: 800; padding: 3px 10px; border-radius: 12px; box-shadow: 0 0 10px rgba(56, 189, 248, 0.6); pointer-events: none; transition: opacity 0.3s ease; opacity: 1; display: flex; align-items: center; gap: 4px; z-index: 20; }

        .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

        /* ORTALANMIŞ 3D HARİTA ALANI */

        #globeViz { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        .timeline-header { display: flex; justify-content: space-between; font-family: 'Syne', sans-serif; color: #38bdf8; font-size: 0.88rem; font-weight: 700; }
        .timeline-labels { display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.75rem; font-weight: 700; font-family: 'Rajdhani', sans-serif; }
        
        input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; background: transparent; height: 20px; margin: 0; cursor: pointer; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #091322; border-radius: 4px; border: 1.5px solid #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; border: 2px solid #ffffff; height: 20px; width: 20px; border-radius: 50%; background: #ef4444; cursor: pointer; margin-top: -7px; box-shadow: 0 0 12px #ef4444; }
        input[type=range]::-moz-range-track { width: 100%; height: 8px; cursor: pointer; background: #091322; border-radius: 4px; border: 1.5px solid #38bdf8; }
        input[type=range]::-moz-range-thumb { border: 2px solid #ffffff; height: 20px; width: 20px; border-radius: 50%; background: #ef4444; cursor: pointer; box-shadow: 0 0 12px #ef4444; }

                min-width: 100% !important; 
                height: 100% !important; 
                position: absolute; 
                top: 0; left: 0; right: 0; bottom: 0; 
                border: none;

<script>
    function normalizeStr(str) {
        if (!str) return "";
        return str.trim().toLowerCase().replace(/ı/g, "i").replace(/i̇/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c");
    }

    function normalizeColor(c) {
        if (!c) return '#38bdf8';
        let col = normalizeStr(String(c));
        if(col === 'kirmizi' || col === 'red') return '#ef4444';
        if(col === 'mavi' || col === 'blue') return '#38bdf8';
        if(col === 'yesil' || col === 'green') return '#22c55e';
        if(col === 'sari' || col === 'yellow') return '#f59e0b';
        if(col === 'turuncu' || col === 'orange') return '#f97316';
        if (/^#([0-9a-f]{6})$/i.test(col)) return col;
        if (/^([0-9a-f]{6})$/i.test(col)) return '#' + col;
        return '#38bdf8';
    }

                    hist: "Çin savaş uçaklarının Tayvan Boğazı ihlalleri rutinleşti. ABD bölgedeki ittifakları güçlendiriyor.", 
                    countries: {"CHN": {role:"Aktör", color:"#ef4444"}, "TWN": {role:"Savunan", color:"#38bdf8"}, "USA": {role:"Garantör Güç", color:"#22c55e"}, "JPN": {role:"Müttefik", color:"#f59e0b"}}, 
                    heatpoints: [{lat: 24.0, lng: 119.5, w: 3, c: '#fde047'}] 
                }
            ]
        },
        {
            id: "SDN", title: "Sudan İç Savaşı", sub: "Kuzey Afrika / Nil Bölgesi",
            timeline: [
                { 
                    year: 2023, 
                    sum: "Ordu ile RSF Arasında Şehir Savaşlarının Başlaması", 
                    hist: "General el-Burhan ile RSF lideri Hemedti arasında başkent Hartum merkezli kanlı iç savaş başladı.", 
                    countries: {"SDN": {role:"Çatışma Merkezi", color:"#ef4444"}}, 
                    heatpoints: [{lat: 15.5, lng: 32.5, w: 2, c: '#fde047'}] 
                },
                { 
                    year: 2026, 
                    sum: "Devlet Sisteminin Çöküşü ve Devasa Kıtlık", 
                    hist: "Ülke fiilen ikiye bölündü, milyonlarca insan sığınmacı konumuna düştü.", 
                    countries: {"SDN": {role:"Çöken Devlet", color:"#ef4444"}, "EGY": {role:"Sınır Komşusu", color:"#38bdf8"}, "ARE": {role:"Finansör", color:"#f59e0b"}}, 
                    heatpoints: [{lat: 15.5, lng: 32.5, w: 3, c: '#fde047'}] 
                }
            ]
        },
        {
            id: "YEM", title: "Kızıldeniz & Yemen Krizi", sub: "Körfez / Babülmendep",
            timeline: [
                { 
                    year: 2014, 
                    sum: "Husilerin Başkenti Ele Geçirmesi", 
                    hist: "İran destekli Husi hareketi Sana'yı alarak Suudi koalisyonun müdahalesini tetikledi.", 
                    countries: {"YEM": {role:"Çatışma Alanı", color:"#ef4444"}, "SAU": {role:"Koalisyon Lideri", color:"#38bdf8"}}, 
                    heatpoints: [{lat: 15.3, lng: 44.2, w: 2, c: '#fde047'}] 
                },
                { 
                    year: 2026, 
                    sum: "Husilerin Kızıldeniz Saldırıları ve ABD Harekatı", 
                    hist: "Husiler Kızıldeniz'de ticari gemileri vururken, ABD-İngiltere koalisyonu Yemen'i bombalıyor.", 
                    countries: {"YEM": {role:"Husiler", color:"#ef4444"}, "USA": {role:"Koalisyon Gücü", color:"#22c55e"}, "GBR": {role:"Koalisyon Gücü", color:"#38bdf8"}, "IRN": {role:"Milis Destekçisi", color:"#dc2626"}}, 
                    heatpoints: [{lat: 12.5, lng: 43.3, w: 3, c: '#fde047'}] 
                }
            ]
        },
        {
            id: "AFL", title: "Sahel Çatışmaları & Darbeler", sub: "Batı Afrika",
            timeline: [
                { 
                    year: 2023, 
                    sum: "Nijer, Mali ve Burkina Faso'da Askeri Darbeler", 
                    hist: "Askeri cuntalar Fransız askerlerini kovup yönetime el koydu.", 
                    countries: {"MLI": {role:"Cunta", color:"#ef4444"}, "NER": {role:"Cunta", color:"#ef4444"}, "BFA": {role:"Cunta", color:"#ef4444"}, "FRA": {role:"Çıkarılan Güç", color:"#38bdf8"}}, 
                    heatpoints: [{lat: 17.6, lng: 8.0, w: 2, c: '#fde047'}] 
                },
                { 
                    year: 2026, 
                    sum: "AES Askeri Paktı ve Rus Wagner Varlığı", 
                    hist: "Rejimler ittifak kurdu, güvenlik boşluğu Rus Afrika Kolordusu askerleriyle dolduruluyor.", 
                    countries: {"MLI": {role:"AES Üyesi", color:"#ef4444"}, "NER": {role:"AES Üyesi", color:"#ef4444"}, "BFA": {role:"AES Üyesi", color:"#ef4444"}, "RUS": {role:"Askeri Destek", color:"#dc2626"}}, 
                    heatpoints: [{lat: 14.0, lng: 0.0, w: 3, c: '#fde047'}] 
                }
            ]
        }
    ];

    let newsData = [];
    let worldGeoJson = null;
    let currentMainMode = 'news';
    let currentActiveItem = null;
    let currentTimelineIndex = 0;
    let activeColorMap = {};

    /* MASAÜSTÜNDE DÜZGÜN HESAPLAYAN HASSAS GENİŞLİK FONKSİYONU */
    function getGlobeWidth() {
        if (window.innerWidth <= 900) {
            return window.innerWidth;
        }
        // Masaüstü: Sol panel (340px) + Sağ panel (380px) = 720px düşülür
        return Math.max(300, window.innerWidth - 720);
    }

    const globeContainer = document.getElementById('globeViz');
    const globe = Globe()(globeContainer)
        .width(getGlobeWidth())
        .height(window.innerHeight - 80)
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
        .showAtmosphere(true)
        .atmosphereColor('#0284c7')
        .atmosphereAltitude(0.12)
        .polygonSideColor(() => 'rgba(2, 132, 199, 0.1)')
        .polygonStrokeColor(() => '#0ea5e9')
        .polygonAltitude(0.015)
        .polygonCapColor((feat) => {
            const geoProps = feat.properties;
            const isoCode = geoProps.ADM0_A3 || geoProps.adm0_a3 || geoProps.ISO_A3 || geoProps.iso_a3 || geoProps.ISO_A2 || "";
            const matched = findMasterCountryByIso(isoCode);
            if (matched && activeColorMap[matched.isoKey]) {
                return activeColorMap[matched.isoKey] + 'dd';
            }
            return 'rgba(10, 15, 29, 0.65)';
        })
        .onPolygonClick((feat) => {
            const geoProps = feat.properties;
            const isoCode = geoProps.ADM0_A3 || geoProps.adm0_a3 || geoProps.ISO_A3 || geoProps.iso_a3 || geoProps.ISO_A2 || "";
            const matched = findMasterCountryByIso(isoCode);
            if (matched) {
                showCountryCard(matched);
            }
        })
        .arcColor('color')
        .arcDashLength(0.4)
        .arcDashGap(0.2)
        .arcDashAnimateTime(1500)
        .arcStroke(0.3)
        .arcAltitude(0.25)
        .pointColor('color')
        .pointAltitude(0.01)
        .pointRadius(0.3)
        .ringColor('c')
        .ringMaxRadius('w')
        .ringPropagationSpeed(1.2)
        .ringRepeatPeriod(800)
        .ringAltitude(0.025);

    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.3;

    window.addEventListener('resize', () => {
        globe.width(getGlobeWidth());
        globe.height(window.innerHeight - 80);
    });

    globeContainer.addEventListener('mousedown', () => { globe.controls().autoRotate = false; });

    fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries.geojson')
        .then(r => r.json())
        .then(geoData => {
            worldGeoJson = geoData;
            fetch('newsData.json').then(r => r.json()).then(liveNews => {
                newsData = liveNews;
                globe.polygonsData(geoData.features);
                switchMainMode('news');
            }).catch(err => {
                newsData = [
                    {
                        title: "Doğu Akdeniz'de Yeni Enerji ve Deniz Yetki Alanı Gerilimi",
                        summary: "Türkiye ve Yunanistan arasında Doğu Akdeniz'deki kıta sahanlığı üzerinden yeni bir kriz tırmanıyor.",
                        history: "Doğu Akdeniz'deki hidrokarbon kaynakları deniz sınırı krizini tetiklemektedir.",
                        tags: ["Akdeniz", "Enerji"],
                        countries: { "TUR": {role:"Sondaj & Donanma", color:"#22c55e"}, "GRC": {role:"İtiraz Eden Güç", color:"#ef4444"}, "CYP": {role:"Taraf Ülke", color:"#f59e0b"} }
                    }
                ];
                globe.polygonsData(geoData.features);
                switchMainMode('news');
            });
        });

    function findMasterCountryByIso(isoCode) {
        if (!isoCode || isoCode === "-99") return null;
        const code = isoCode.toUpperCase().trim();
        if (countryMasterDict[code]) return { isoKey: code, ...countryMasterDict[code] };
        return null;
    }

    function findMasterCountryByName(queryName) {
        if (!queryName) return null;
        const q = normalizeStr(queryName);
        for (let [iso, data] of Object.entries(countryMasterDict)) {
            if (data.names && data.names.some(k => k === q)) return { isoKey: iso, ...data };
        }
        return null;
    }

    function switchMobileTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.sidebar, .globe-container, .info-panel').forEach(el => el.classList.remove('mobile-active'));

        if (tabId === 'sidebarSection') {
            document.getElementById('tab-btn-sidebar').classList.add('active');
            document.getElementById('sidebarSection').classList.add('mobile-active');
        } else if (tabId === 'mapSection') {
            document.getElementById('tab-btn-map').classList.add('active');
            document.getElementById('mapSection').classList.add('mobile-active');
            setTimeout(() => {
                globe.width(getGlobeWidth());
                globe.height(window.innerHeight - 80);
            }, 100);
        } else if (tabId === 'panelSection') {
            document.getElementById('tab-btn-panel').classList.add('active');
            document.getElementById('panelSection').classList.add('mobile-active');
        }
    }

    function switchMainMode(mode) {
        currentMainMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-mode-${mode}`).classList.add('active');
        document.getElementById('searchBoxContainer').style.display = (mode === 'news') ? 'block' : 'none';
        document.getElementById('timelineContainer').style.display = 'none';
        
        const searchInput = document.getElementById('newsSearchInput');
        if (searchInput) searchInput.value = '';

        hideCountryCard();
        executeSearch();
        
        // Yeniden boyutlandırmayı tetikle
        setTimeout(() => {
            globe.width(getGlobeWidth());
            globe.height(window.innerHeight - 80);
        }, 50);
    }

    function executeSearch() {
        const listEl = document.getElementById('sidebarContentList');
        const query = normalizeStr(document.getElementById('newsSearchInput').value);
        listEl.innerHTML = '';

        let dataSource = (currentMainMode === 'news') ? newsData : (currentMainMode === 'orgs' ? orgListData : conflictListData);
        
        let filteredData = dataSource.filter(item => {
            if (!query) return true;
            const titleMatch = normalizeStr(item.title).includes(query);
            const subMatch = item.sub ? normalizeStr(item.sub).includes(query) : false;
            const summaryMatch = item.summary ? normalizeStr(item.summary).includes(query) : false;
            const tagMatch = item.tags ? item.tags.some(t => normalizeStr(t).includes(query)) : false;
            return titleMatch || subMatch || summaryMatch || tagMatch;
        });

        filteredData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `news-card ${index === 0 ? 'active' : ''}`;
            card.onclick = () => selectItem(item, card);
            
            if (currentMainMode === 'news') {
                const tagsHtml = item.tags ? item.tags.map(t => `<span class="tag" onclick="event.stopPropagation(); searchByTag('${t}')">${t}</span>`).join('') : '';
                card.innerHTML = `<h3>${item.title}</h3><div class="tags">${tagsHtml}</div>`;
            } else {
                card.innerHTML = `<h3>${item.title}</h3><p class="sub">${item.sub}</p>`;
            }
            listEl.appendChild(card);
        });

        if (filteredData.length > 0) selectItem(filteredData[0], listEl.firstChild);
        checkScrollIndicator();
    }

    function checkScrollIndicator() {
        const listEl = document.getElementById('sidebarContentList');
        const indicator = document.getElementById('scrollIndicator');
        if (!listEl || !indicator) return;

        const isScrollable = listEl.scrollHeight > listEl.clientHeight;
        const isAtBottom = listEl.scrollTop + listEl.clientHeight >= listEl.scrollHeight - 15;

        if (isScrollable && !isAtBottom) {
            indicator.style.opacity = '1';
        } else {
            indicator.style.opacity = '0';
        }
    }

    function searchByTag(tagName) {
        const input = document.getElementById('newsSearchInput');
        input.value = tagName;
        executeSearch();
    }

    function selectItem(item, cardEl) {
        document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
        if(cardEl) cardEl.classList.add('active');
        
        currentActiveItem = { type: currentMainMode, data: item };

        if (currentMainMode === 'conflicts') {
            document.getElementById('timelineContainer').style.display = 'flex';
            currentTimelineIndex = item.timeline.length - 1; 
            initTimeline(item);
            renderTimelineData();
        } else {
            document.getElementById('timelineContainer').style.display = 'none';
            renderStaticData();
        }
    }

    function initTimeline(conflict) {
        const slider = document.getElementById('timeSlider');
        slider.max = conflict.timeline.length - 1;
        slider.value = currentTimelineIndex;
        
        const labels = document.getElementById('timelineLabels');
        labels.innerHTML = '';
        conflict.timeline.forEach((tl, idx) => {
            const span = document.createElement('span');
            span.innerText = tl.year;
            labels.appendChild(span);
        });
    }

    function onSliderChange() {
        const val = parseInt(document.getElementById('timeSlider').value);
        if (val !== currentTimelineIndex) {
            currentTimelineIndex = val;
            renderTimelineData();
        }
    }

    function renderStaticData() {
        const data = currentActiveItem.data;
        const type = currentActiveItem.type;

        if (type === 'news') {
            document.getElementById('panelTitle').innerText = "Saha İstihbarat Özeti";
            document.getElementById('legendTitle').innerText = "Olaydaki Aktörler";
            document.getElementById('summaryText').innerText = data.summary;
            document.getElementById('historyText').innerText = data.history;
            
            let legendHtml = '';
            activeColorMap = {};
            const arcs = [], points = [];
            let primaryCountry = null;

            for (const [code, info] of Object.entries(data.countries)) {
                const matched = findMasterCountryByIso(code) || findMasterCountryByName(code);
                if (matched) {
                    const col = normalizeColor(info.color);
                    activeColorMap[matched.isoKey] = col;
                    legendHtml += `<div class="legend-item"><span><strong>${matched.trName}</strong><br><small>${info.role}</small></span><span class="legend-color" style="background: ${col};"></span></div>`;
                    points.push({lat: matched.lat, lng: matched.lng, color: col});

                    if (!primaryCountry) {
                        primaryCountry = matched;
                    } else {
                        arcs.push({ 
                            startLat: primaryCountry.lat, startLng: primaryCountry.lng, 
                            endLat: matched.lat, endLng: matched.lng, 
                            color: [activeColorMap[primaryCountry.isoKey], col]
                        });
                    }
                }
            }
            
            document.getElementById('countryLegend').innerHTML = legendHtml;
            globe.polygonCapColor(globe.polygonCapColor());
            globe.arcsData(arcs);
            globe.ringsData([]);
            globe.pointsData(points);
            if (points.length > 0) globe.pointOfView({ lat: points[0].lat, lng: points[0].lng, altitude: 1.8 }, 1200);
        } 
        else if (type === 'orgs') {
            const orgId = data.id;
            const info = orgInfoData[orgId];
            document.getElementById('panelTitle').innerText = "Örgüt Doktrini & Özeti";
            document.getElementById('legendTitle').innerText = "Üye Ülkeler Listesi";
            document.getElementById('summaryText').innerText = info.summary;
            document.getElementById('historyText').innerText = info.history;

            activeColorMap = {};
            const arcs = [];
            let centerMatched = findMasterCountryByIso(info.center);
            
            const chips = info.membersIso.map(iso => {
                const matched = findMasterCountryByIso(iso);
                if(matched) {
                    activeColorMap[matched.isoKey] = '#0284c7';
                    if (centerMatched && matched.isoKey !== centerMatched.isoKey) {
                        arcs.push({ startLat: centerMatched.lat, startLng: centerMatched.lng, endLat: matched.lat, endLng: matched.lng, color: ['#0284c7', '#38bdf8']});
                    }
                    return `<span class="member-chip">${matched.trName}</span>`;
                }
                return '';
            }).join('');

            document.getElementById('countryLegend').innerHTML = `<div class="legend-item"><span><strong>${info.title}</strong></span><span class="legend-color" style="background:#0284c7;"></span></div><div class="member-chips">${chips}</div>`;
            
            globe.polygonCapColor(globe.polygonCapColor());
            globe.arcsData(arcs);
            globe.ringsData([]);
            globe.pointsData([]);
            if (centerMatched) globe.pointOfView({ lat: centerMatched.lat, lng: centerMatched.lng, altitude: 2.0 }, 1500);
        }
    }

    function renderTimelineData() {
        const conflict = currentActiveItem.data;
        const tlData = conflict.timeline[currentTimelineIndex];
        
        document.getElementById('currentYearDisplay').innerText = tlData.year;
        document.getElementById('panelTitle').innerText = `${tlData.year} - Saha İstihbarat Özeti`;
        document.getElementById('legendTitle').innerText = "Taraf Ülkeler & Rolleri";
        document.getElementById('summaryText').innerText = tlData.sum;
        document.getElementById('historyText').innerText = tlData.hist;

        let legendHtml = '';
        activeColorMap = {};
        const points = [], rings = [];

        const actors = Object.entries(tlData.countries);
        actors.forEach(([code, info]) => {
            const matched = findMasterCountryByIso(code) || findMasterCountryByName(code);
            if (matched) {
                const col = normalizeColor(info.color);
                activeColorMap[matched.isoKey] = col;
                legendHtml += `<div class="legend-item"><span><strong>${matched.trName}</strong><br><small>${info.role}</small></span><span class="legend-color" style="background: ${col};"></span></div>`;
                points.push({lat: matched.lat, lng: matched.lng, color: col});
            }
        });

        if (tlData.heatpoints) {
            tlData.heatpoints.forEach(hp => {
                rings.push({ lat: hp.lat, lng: hp.lng, w: hp.w * 1.5, c: hp.c }); 
            });
        }

        document.getElementById('countryLegend').innerHTML = legendHtml;
        globe.polygonCapColor(globe.polygonCapColor());
        globe.arcsData([]);
        globe.pointsData(points);
        globe.ringsData(rings); 
        
        if (points.length > 0) globe.pointOfView({ lat: points[0].lat, lng: points[0].lng, altitude: 1.6 }, 1000);
        else if (rings.length > 0) globe.pointOfView({ lat: rings[0].lat, lng: rings[0].lng, altitude: 1.6 }, 1000);
    }

    function showCountryCard(countryData) {
        const card = document.getElementById('countryCard');
        document.getElementById('cardCountryName').innerText = countryData.trName;
        document.getElementById('cardFounding').innerText = countryData.founding || '-';
        document.getElementById('cardPop').innerText = countryData.pop || '-';
        document.getElementById('cardArea').innerText = countryData.area || '-';
        document.getElementById('cardPact').innerText = countryData.pact || '-';
        card.style.display = 'block';
    }

    function hideCountryCard() {
        document.getElementById('countryCard').style.display = 'none';
    }
</script>
</body>
</html>

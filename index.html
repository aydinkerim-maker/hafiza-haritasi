    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', 'Inter', sans-serif; background: #02040a; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: rgba(5, 8, 17, 0.95); backdrop-filter: blur(16px); padding: 12px 20px; border-bottom: 2px solid #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25); display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { font-family: 'Syne', 'Rajdhani', sans-serif; font-size: 1.3rem; font-weight: 800; color: #38bdf8; letter-spacing: 1.5px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; text-shadow: 0 0 18px rgba(56, 189, 248, 0.6); cursor: pointer; user-select: none; }
        
        .radar-box { position: relative; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #22c55e; box-shadow: 0 0 12px #22c55e; overflow: hidden; }
        .radar-sweep { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: conic-gradient(from 0deg, rgba(34,197,94,0.5), transparent 60deg); border-radius: 50%; animation: sweep 2s linear infinite; }
        @keyframes sweep { 100% { transform: rotate(360deg); } }

        .live-tag { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #22c55e; font-weight: 700; letter-spacing: 1px; background: rgba(34, 197, 94, 0.1); padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(34, 197, 94, 0.4); cursor: pointer; }

        .header-controls { display: flex; flex-direction: column; gap: 8px; }
        .org-menu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .org-menu::-webkit-scrollbar { display: none; }
        .mode-btn { background: #0f172a; color: #94a3b8; border: 1px solid #1e293b; padding: 8px 16px; border-radius: 4px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .mode-btn:hover { background: #1e293b; color: #fff; border-color: #38bdf8; }
        .mode-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 15px rgba(2, 132, 199, 0.6); }

        .mobile-view-tabs { display: none; gap: 6px; background: #050811; padding: 4px; border-radius: 6px; border: 1px solid #1e293b; }
        .tab-btn { flex: 1; padding: 8px 0; border: none; background: #0f172a; color: #94a3b8; font-size: 0.85rem; font-weight: 700; cursor: pointer; border-radius: 4px; text-align: center; }
        .tab-btn.active { color: #fff; background: #0284c7; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #02040a; }
        
        .sidebar { width: 340px; min-width: 340px; background: #0a0f1d; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        
        .search-box { padding: 12px; background: #050811; border-bottom: 1px solid #1e293b; }
        .search-box input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #38bdf8; color: #f1f5f9; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 0.85rem; outline: none; }
        
        .news-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .news-card { padding: 14px; background: #0f172a; border-radius: 6px; border: 1px solid #1e293b; cursor: pointer; transition: all 0.2s ease; }
        .news-card:hover, .news-card.active { background: #1e293b; border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }
        .news-card h3 { font-size: 0.9rem; color: #f8fafc; line-height: 1.4; font-weight: 600; margin-bottom: 6px; }
        .news-card p.sub { font-size: 0.78rem; color: #94a3b8; }
        
        .globe-container { flex: 1; position: relative; background: #02040a; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
        #globeViz { flex: 1; width: 100%; height: 100%; }

        /* GÖRÜNÜR TIMELINE SLIDER STİLLERİ */
        .timeline-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(12px); border: 1px solid #38bdf8; padding: 12px 20px; border-radius: 8px; display: none; flex-direction: column; gap: 10px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); z-index: 100; }
        .timeline-header { display: flex; justify-content: space-between; font-family: 'Syne', sans-serif; color: #38bdf8; font-size: 0.9rem; font-weight: 700; letter-spacing: 1px; }
        .timeline-labels { display: flex; justify-content: space-between; color: #94a3b8; font-size: 0.75rem; font-weight: 600; font-family: 'Inter', sans-serif; position: relative; padding: 0 10px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
        input[type=range]:focus { outline: none; }
        /* BAR (TRACK) BELİRGİNLEŞTİRİLDİ */
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: rgba(56, 189, 248, 0.25); border-radius: 4px; border: 1px solid #38bdf8; }
        input[type=range]::-moz-range-track { width: 100%; height: 8px; cursor: pointer; background: rgba(56, 189, 248, 0.25); border-radius: 4px; border: 1px solid #38bdf8; }
        
        input[type=range]::-webkit-slider-thumb { border: 2px solid #fff; height: 20px; width: 20px; border-radius: 50%; background: #ef4444; cursor: pointer; -webkit-appearance: none; margin-top: -7px; box-shadow: 0 0 12px #ef4444; transition: all 0.2s; }
        input[type=range]::-moz-range-thumb { border: 2px solid #fff; height: 20px; width: 20px; border-radius: 50%; background: #ef4444; cursor: pointer; box-shadow: 0 0 12px #ef4444; transition: all 0.2s; }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .country-card { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(12px); border: 1px solid #38bdf8; border-radius: 6px; padding: 14px; width: 320px; display: none; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        .country-card h3 { font-family: 'Syne', 'Rajdhani', sans-serif; font-size: 1rem; color: #38bdf8; margin-bottom: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
        .country-card .close-btn { cursor: pointer; color: #ef4444; font-size: 0.9rem; }
        .country-info-grid { font-size: 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: #cbd5e1; }

        .info-panel { width: 380px; min-width: 380px; background: #0a0f1d; border-left: 1px solid #1e293b; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; z-index: 10; }
        .panel-block { background: #0f172a; padding: 14px; border-radius: 6px; border: 1px solid #1e293b; }
        .panel-block h4 { font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.8px; }
        .panel-block p { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6; white-space: pre-line; }

        .history-block h4 { color: #f59e0b; }

        .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid #1e293b; font-family: 'Inter', sans-serif; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; display: inline-block; box-shadow: 0 0 5px currentColor; }
        .member-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; max-height: 180px; overflow-y: auto; }
        .member-chip { background: #1e293b; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.72rem; padding: 3px 6px; border-radius: 4px; }

        @media (max-width: 900px) {
            header { padding: 10px; }
            .mobile-view-tabs { display: flex; }
            .app-container { display: block; }
            .sidebar, .info-panel, .globe-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
            .sidebar.mobile-active { display: flex; width: 100%; }
            .globe-container.mobile-active { display: block; }
            .info-panel.mobile-active { display: flex; width: 100%; border-left: none; }
        }
    </style>

            if (!str) return "";
            return str.trim().toLowerCase().replace(/ı/g, "i").replace(/i̇/g, "i").replace(/ğ/g, "g").replace(/ü/g, "u").replace(/ş/g, "s").replace(/ö/g, "o").replace(/ç/g, "c");
        }

        function normalizeColor(c) {
            if (!c) return '#38bdf8';
            let col = normalizeStr(String(c));
            if(col === 'kirmizi' || col === 'red') return '#ef4444';
            if(col === 'mavi' || col === 'blue') return '#38bdf8';
            if(col === 'yesil' || col === 'green') return '#22c55e';
            if(col === 'sari' || col === 'yellow') return '#f59e0b';
            if(col === 'turuncu' || col === 'orange') return '#f97316';
            if (/^#([0-9a-f]{6})$/i.test(col)) return col;

                const iso = p.ADM0_A3 || p.adm0_a3 || p.ISO_A3 || p.iso_a3 || p.ISO_A2 || "";
                const matched = findMasterCountryByIso(iso);
                if (matched && activeColorMap[matched.isoKey]) return activeColorMap[matched.isoKey] + 'dd';
                return 'rgba(10, 15, 29, 0.65)';
            })

            .arcDashGap(0.2)
            .arcDashAnimateTime(1500)

        function findMasterCountryByIso(isoCode) {
            if (!isoCode || isoCode === "-99") return null;
            const code = isoCode.toUpperCase().trim();
            if (countryMasterDict[code]) return { isoKey: code, ...countryMasterDict[code] };
            return null;
        }

        function findMasterCountryByName(queryName) {
            if (!queryName) return null;
            const q = toTRLowerCase(queryName);
            for (let [iso, data] of Object.entries(countryMasterDict)) {
                if (data.names && data.names.some(k => k === q)) return { isoKey: iso, ...data };
            }
            return null;
        }

        function switchMainMode(mode) {
            currentMainMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-mode-${mode}`).classList.add('active');
            document.getElementById('searchBoxContainer').style.display = (mode === 'news') ? 'block' : 'none';
            document.getElementById('timelineContainer').style.display = 'none';
            executeSearch();
        }

        function executeSearch() {
            const listEl = document.getElementById('sidebarContentList');
            listEl.innerHTML = '';
            let dataSource = (currentMainMode === 'news') ? newsData : (currentMainMode === 'orgs' ? orgListData : conflictListData);
            
            dataSource.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectItem(item, card);
                
                if (currentMainMode === 'news') {
                    const tagsHtml = item.tags ? item.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';
                    card.innerHTML = `<h3>${item.title}</h3><div class="tags">${tagsHtml}</div>`;
                } else {
                    card.innerHTML = `<h3>${item.title}</h3><p class="sub">${item.sub}</p>`;
                }
                listEl.appendChild(card);
            });

            if (dataSource.length > 0) selectItem(dataSource[0], listEl.firstChild);
        }

        let activeColorMap = {};

        function selectItem(item, cardEl) {
            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
            if(cardEl) cardEl.classList.add('active');
            
            currentActiveItem = { type: currentMainMode, data: item };

            if (currentMainMode === 'conflicts') {
                document.getElementById('timelineContainer').style.display = 'flex';
                currentTimelineIndex = item.timeline.length - 1; 
                initTimeline(item);
                renderTimelineData();
            } else {
                document.getElementById('timelineContainer').style.display = 'none';
                renderStaticData();
            }
        }

        function initTimeline(conflict) {
            const slider = document.getElementById('timeSlider');
            slider.max = conflict.timeline.length - 1;
            slider.value = currentTimelineIndex;
            
            const labels = document.getElementById('timelineLabels');
            labels.innerHTML = '';
            conflict.timeline.forEach(tl => {
                const span = document.createElement('span');
                span.innerText = tl.year;
                labels.appendChild(span);
            });
        }

        function onSliderChange() {
            const val = parseInt(document.getElementById('timeSlider').value);
            if (val !== currentTimelineIndex) {
                currentTimelineIndex = val;
                renderTimelineData();
            }
        }

        function renderStaticData() {
            const data = currentActiveItem.data;
            const type = currentActiveItem.type;

            if (type === 'news') {
                document.getElementById('panelTitle').innerText = "Saha İstihbarat Özeti";
                document.getElementById('legendTitle').innerText = "Olaydaki Aktörler & Konumları";
                document.getElementById('summaryText').innerText = data.summary;
                document.getElementById('historyText').innerText = data.history;
                
                let legendHtml = '';
                activeColorMap = {};
                const arcs = [], points = [];

                for (const [code, info] of Object.entries(data.countries)) {
                    const matched = findMasterCountryByIso(code) || findMasterCountryByName(code);
                    if (matched) {
                        const col = normalizeColor(info.color);
                        activeColorMap[matched.isoKey] = col;
                        legendHtml += `<div class="legend-item"><span><strong>${matched.trName}</strong><br><small>${info.role}</small></span><span class="legend-color" style="background: ${col};"></span></div>`;
                        points.push({lat: matched.lat, lng: matched.lng, color: col});
                    }
                }
                
                // HABERLER İÇİN EKSİK OLAN BAĞLANTI (ARC) ÇİZGİLERİ EKLENDİ
                for (let i = 0; i < points.length; i++) {
                    for (let j = i + 1; j < points.length; j++) {
                        arcs.push({
                            startLat: points[i].lat, startLng: points[i].lng,
                            endLat: points[j].lat, endLng: points[j].lng,
                            color: [points[i].color, points[j].color]
                        });
                    }
                }

                document.getElementById('countryLegend').innerHTML = legendHtml;
                globe.polygonCapColor(globe.polygonCapColor());
                globe.arcsData(arcs);
                globe.ringsData([]);
                globe.pointsData(points);
                if (points.length > 0) globe.pointOfView({ lat: points[0].lat, lng: points[0].lng, altitude: 1.8 }, 1200);
            } 
            else if (type === 'orgs') {
                const orgId = data.id;
                const info = orgInfoData[orgId];
                document.getElementById('panelTitle').innerText = "Örgüt Doktrini & Özeti";
                document.getElementById('legendTitle').innerText = "Üye Ülkeler Listesi";
                document.getElementById('summaryText').innerText = info.summary;
                document.getElementById('historyText').innerText = info.history;

                activeColorMap = {};
                const arcs = [];
                let centerMatched = findMasterCountryByIso(info.center);
                
                const chips = info.membersIso.map(iso => {
                    const matched = findMasterCountryByIso(iso);
                    if(matched) {
                        activeColorMap[matched.isoKey] = '#0284c7';
                        if (centerMatched && matched.isoKey !== centerMatched.isoKey) {
                            arcs.push({ startLat: centerMatched.lat, startLng: centerMatched.lng, endLat: matched.lat, endLng: matched.lng, color: ['#0284c7', '#38bdf8']});
                        }
                        return `<span class="member-chip">${matched.trName}</span>`;
                    }
                    return '';
                }).join('');

                document.getElementById('countryLegend').innerHTML = `<div class="legend-item"><span><strong>${info.title}</strong></span><span class="legend-color" style="background:#0284c7;"></span></div><div class="member-chips">${chips}</div>`;
                
                globe.polygonCapColor(globe.polygonCapColor());
                globe.arcsData(arcs);
                globe.ringsData([]);
                globe.pointsData([]);
                if (centerMatched) globe.pointOfView({ lat: centerMatched.lat, lng: centerMatched.lng, altitude: 2.0 }, 1500);
            }
        }

        function renderTimelineData() {
            const conflict = currentActiveItem.data;
            const tlData = conflict.timeline[currentTimelineIndex];
            
            document.getElementById('currentYearDisplay').innerText = tlData.year;
            document.getElementById('panelTitle').innerText = `${tlData.year} - Saha İstihbarat Özeti`;
            document.getElementById('legendTitle').innerText = "Taraf Ülkeler & Rolleri";
            document.getElementById('summaryText').innerText = tlData.sum;
            document.getElementById('historyText').innerText = tlData.hist; // ZENGİNLEŞTİRİLMİŞ TARİHSEL METİNLER BURAYA YANSIR

            let legendHtml = '';
            activeColorMap = {};
            const points = [], rings = [];

            const actors = Object.entries(tlData.countries);
            actors.forEach(([code, info]) => {
                const matched = findMasterCountryByIso(code) || findMasterCountryByName(code);
                if (matched) {
                    const col = normalizeColor(info.color);
                    activeColorMap[matched.isoKey] = col;
                    legendHtml += `<div class="legend-item"><span><strong>${matched.trName}</strong><br><small>${info.role}</small></span><span class="legend-color" style="background: ${col};"></span></div>`;
                    points.push({lat: matched.lat, lng: matched.lng, color: col});
                }
            });

            if (tlData.heatpoints) {
                tlData.heatpoints.forEach(hp => {
                    rings.push({ lat: hp.lat, lng: hp.lng, w: hp.w * 1.5, c: hp.c }); 
                });
            }

            document.getElementById('countryLegend').innerHTML = legendHtml;
            globe.polygonCapColor(globe.polygonCapColor());
            globe.arcsData([]);
            globe.pointsData(points);
            globe.ringsData(rings); 
            
            if (points.length > 0) globe.pointOfView({ lat: points[0].lat, lng: points[0].lng, altitude: 1.6 }, 1000);
            else if (rings.length > 0) globe.pointOfView({ lat: rings[0].lat, lng: rings[0].lng, altitude: 1.6 }, 1000);
        }

        function switchMobileTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            ['sidebarSection','mapSection','panelSection'].forEach(id => document.getElementById(id).classList.remove('mobile-active'));
            document.getElementById(tabName === 'news' ? 'sidebarSection' : tabName === 'map' ? 'mapSection' : 'panelSection').classList.add('mobile-active');
        }
    </script>
</body>
</html>

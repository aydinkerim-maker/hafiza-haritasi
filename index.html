        body {

            background: #050811; 
            color: #f1f5f9; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        header { background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(16px); padding: 12px 20px; border-bottom: 2px solid #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25); display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        
        .logo { font-family: 'Orbitron', 'Rajdhani', sans-serif; font-size: 1.25rem; font-weight: 900; color: #38bdf8; letter-spacing: 2px; display: flex; align-items: center; gap: 12px; text-transform: uppercase; text-shadow: 0 0 18px rgba(56, 189, 248, 0.6); cursor: pointer; user-select: none; }
        
        .radar-box { position: relative; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #22c55e; box-shadow: 0 0 12px #22c55e; overflow: hidden; }
        .radar-sweep { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: conic-gradient(from 0deg, rgba(34,197,94,0.5), transparent 60deg); border-radius: 50%; animation: sweep 2s linear infinite; }
        @keyframes sweep { 100% { transform: rotate(360deg); } }

        .live-tag { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #22c55e; font-weight: 700; letter-spacing: 1px; background: rgba(34, 197, 94, 0.1); padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(34, 197, 94, 0.4); cursor: pointer; }

        .header-controls { display: flex; flex-direction: column; gap: 8px; }
        .org-menu { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
        .org-menu::-webkit-scrollbar { display: none; }
        
        .mode-btn { background: #0f172a; color: #94a3b8; border: 1px solid #1e293b; padding: 8px 16px; border-radius: 4px; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .mode-btn:hover { background: #1e293b; color: #fff; border-color: #38bdf8; }
        .mode-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 15px rgba(2, 132, 199, 0.6); }

        .mobile-view-tabs { display: none; gap: 6px; background: #050811; padding: 4px; border-radius: 6px; border: 1px solid #1e293b; }
        .tab-btn { flex: 1; padding: 8px 0; border: none; background: #0f172a; color: #94a3b8; font-size: 0.85rem; font-weight: 700; cursor: pointer; border-radius: 4px; text-align: center; }
        .tab-btn.active { color: #fff; background: #0284c7; box-shadow: 0 0 10px rgba(2, 132, 199, 0.5); }

        .app-container { display: flex; flex: 1; overflow: hidden; position: relative; background: #050811; }
        
        .sidebar { width: 360px; background: #0a0f1d; border-right: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 10; }
        .tag-search-info { display: none; padding: 8px 12px; background: rgba(56, 189, 248, 0.1); border-bottom: 1px solid rgba(56, 189, 248, 0.2); font-size: 0.78rem; color: #38bdf8; justify-content: space-between; align-items: center; }
        .clear-tag-btn { background: #ef4444; color: #fff; border: none; padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 0.7rem; font-weight: bold; }

        .news-list { overflow-y: auto; flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .news-card { padding: 14px; background: #0f172a; border-radius: 6px; border: 1px solid #1e293b; cursor: pointer; transition: all 0.25s ease; position: relative; }
        .news-card:hover { background: #1e293b; border-color: #38bdf8; transform: translateX(4px); }
        .news-card.active { background: #1e293b; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); }
        .news-card h3 { font-size: 0.95rem; margin-bottom: 6px; color: #f8fafc; line-height: 1.4; font-weight: 600; }
        .news-card p.sub { font-size: 0.8rem; color: #94a3b8; }
        
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
        .tag { background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 0.7rem; padding: 2px 8px; border-radius: 3px; border: 1px solid rgba(56, 189, 248, 0.3); font-weight: 700; transition: all 0.2s; }
        .tag:hover { background: #0284c7; color: #fff; }

        .map-container { flex: 1; position: relative; background: #050811; }
        #map { width: 100%; height: 100%; background: #050811; }

        .country-card { position: absolute; top: 20px; right: 20px; z-index: 1000; background: rgba(10, 15, 29, 0.95); backdrop-filter: blur(12px); border: 1px solid #38bdf8; border-radius: 6px; padding: 16px; width: 290px; display: none; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3); }
        .country-card h3 { font-family: 'Orbitron', 'Rajdhani', sans-serif; font-size: 1.05rem; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 6px; }
        .country-info-grid { font-size: 0.82rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: #cbd5e1; }

        .info-panel { width: 440px; background: #0a0f1d; border-left: 1px solid #1e293b; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; z-index: 10; }
        .panel-block { background: #0f172a; padding: 16px; border-radius: 6px; border: 1px solid #1e293b; }
        .panel-block h4 { font-family: 'Orbitron', 'Rajdhani', sans-serif; font-size: 0.82rem; color: #38bdf8; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        
        /* TÜRKÇE OKUNAKLI ANALİZ METİNLERİ */
        .panel-block p { font-family: 'Inter', sans-serif; font-size: 0.88rem; color: #cbd5e1; line-height: 1.7; white-space: pre-line; }

        .history-block h4 { color: #f59e0b; }

        .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #1e293b; font-family: 'Inter', sans-serif; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
        
        .member-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; max-height: 180px; overflow-y: auto; padding-right: 4px; }
        .member-chip { background: #1e293b; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-family: 'Inter', sans-serif; }

        .source-btn { display: inline-block; width: 100%; text-align: center; background: #0284c7; color: #fff; text-decoration: none; padding: 12px; border-radius: 4px; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.5px; box-shadow: 0 0 15px rgba(2, 132, 199, 0.4); transition: all 0.2s; text-transform: uppercase; }

            .mobile-view-tabs { display: flex; }
            .app-container { flex-direction: column; }
            .sidebar, .info-panel, .map-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
            .sidebar.mobile-active { display: flex; width: 100%; }
            .map-container.mobile-active { display: block; }
            .info-panel.mobile-active { display: flex; width: 100%; border-left: none; }
            .country-card { top: 12px; right: 12px; left: 12px; width: auto; }
        }

                if (!selectedTagFilter) return true;
                const cleanSelected = selectedTagFilter.toLowerCase().replace('#', '').trim();
                return news.tags && news.tags.some(t => t.toLowerCase().replace('#', '').trim().includes(cleanSelected));
            });

            filteredNews.forEach((news, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectNews(news, card);

                const tagsHtml = news.tags ? news.tags.map(t => `<span class="tag" onclick="filterByTag('${t}', event)">${t}</span>`).join('') : '';
                card.innerHTML = `<h3>${news.title}</h3><div class="tags">${tagsHtml}</div>`;
                listEl.appendChild(card);
            });

            if (filteredNews.length > 0) {
                selectNews(filteredNews[0], listEl.firstChild);
            }
        }

        function renderOrgList() {
            const listEl = document.getElementById('sidebarContentList');
            listEl.innerHTML = '';

            orgListData.forEach((org, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectOrg(org.id, card);
                card.innerHTML = `<h3>${org.title}</h3><p class="sub">${org.sub}</p>`;
                listEl.appendChild(card);
            });

            if (orgListData.length > 0) {
                selectOrg(orgListData[0].id, listEl.firstChild);
            }
        }

        function renderConflictList() {
            const listEl = document.getElementById('sidebarContentList');
            listEl.innerHTML = '';

            conflictListData.forEach((conf, index) => {
                const card = document.createElement('div');
                card.className = `news-card ${index === 0 ? 'active' : ''}`;
                card.onclick = () => selectConflict(conf, card);
                card.innerHTML = `<h3>${conf.title}</h3><p class="sub">${conf.sub}</p>`;
                listEl.appendChild(card);
            });

            if (conflictListData.length > 0) {
                selectConflict(conflictListData[0], listEl.firstChild);
            }
        }

        function selectNews(news, cardEl) {
            currentActiveItem = { type: 'news', data: news };
            highlightCard(cardEl);

            document.getElementById('panelTitle').innerText = "Saha İstihbarat Özeti";
            document.getElementById('legendTitle').innerText = "Olaydaki Aktörler & Konumları";
            document.getElementById('historyTitle').innerText = "Tarihsel Arka Plan & Derin Hafıza";

            document.getElementById('summaryText').innerText = news.summary;
            document.getElementById('historyText').innerText = news.history;
            
            const sourceBtn = document.getElementById('sourceLink');
            sourceBtn.href = news.link;
            sourceBtn.style.display = 'block';

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(news.countries)) {
                const turkishName = countryProfiles[code]?.trName || trNameDict[code] || code;
                legendEl.innerHTML += `
                    <div class="legend-item" style="cursor:pointer;" onclick="showCountryCard('${code}', '${code}')">
                        <span><strong>${turkishName}</strong> (${info.role})</span>
                        <span class="legend-color" style="background: ${info.color}"></span>
                    </div>
                `;
            }
            drawMap();
        }

        function selectOrg(orgId, cardEl) {
            currentActiveItem = { type: 'org', id: orgId };
            highlightCard(cardEl);

            const info = orgInfoData[orgId];
            if (!info) return;

            document.getElementById('panelTitle').innerText = "Örgüt Doktrini & Özeti";
            document.getElementById('legendTitle').innerText = "Üye Ülkeler Listesi";
            document.getElementById('historyTitle').innerText = "Stratejik & Tarihsel Rolü";

            document.getElementById('summaryText').innerText = info.summary;
            document.getElementById('historyText').innerText = info.history;
            
            const legendEl = document.getElementById('countryLegend');
            const memberChipsHtml = info.membersTr.map(m => `<span class="member-chip">${m}</span>`).join('');
            legendEl.innerHTML = `<div class="legend-item"><span><strong>${info.title}</strong></span><span class="legend-color" style="background:#0284c7;"></span></div><div class="member-chips">${memberChipsHtml}</div>`;
            
            document.getElementById('sourceLink').style.display = 'none';
            drawMap();
        }

        function selectConflict(conf, cardEl) {
            currentActiveItem = { type: 'conflict', data: conf };
            highlightCard(cardEl);

            document.getElementById('panelTitle').innerText = "Çatışma Analiz Özeti";
            document.getElementById('legendTitle').innerText = "Taraf Ülkeler & Rolleri";
            document.getElementById('historyTitle').innerText = "Stratejik Arka Plan & Derin Hafıza";

            document.getElementById('summaryText').innerText = conf.summary;
            document.getElementById('historyText').innerText = conf.history;

            const legendEl = document.getElementById('countryLegend');
            legendEl.innerHTML = '';

            for (const [code, info] of Object.entries(conf.countries)) {
                const turkishName = countryProfiles[code]?.trName || trNameDict[code] || code;
                legendEl.innerHTML += `
                    <div class="legend-item" style="cursor:pointer;" onclick="showCountryCard('${code}', '${code}')">
                        <span><strong>${turkishName}</strong> (${info.role})</span>
                        <span class="legend-color" style="background: ${info.color}"></span>
                    </div>
                `;
            }

            document.getElementById('sourceLink').style.display = 'none';
            drawMap();
        }

        function highlightCard(cardEl) {
            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active'));
            if(cardEl) cardEl.classList.add('active');
        }

        function checkExactMembership(countryName, targetList) {
            const nameLower = countryName.toLowerCase().trim();
            return targetList.some(member => {
                const memberLower = member.toLowerCase().trim();
                if (nameLower === memberLower) return true;
                if (nameLower.startsWith(memberLower + " ") || nameLower.endsWith(" " + memberLower)) return true;
                return false;
            });
        }

        function drawMap() {
            if (!worldGeoData || !currentActiveItem) return;
            if (geojsonLayer) map.removeLayer(geojsonLayer);

            let highlightedBounds = L.latLngBounds();

            geojsonLayer = L.geoJson(worldGeoData, {
                style: (feature) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;

                    if (currentActiveItem.type === 'org') {
                        const orgId = currentActiveItem.id;
                        let isOrgMember = false;
                        if (orgId === 'UN') {
                            isOrgMember = true;
                        } else {
                            const orgList = orgInfoData[orgId]?.membersEn || [];
                            isOrgMember = checkExactMembership(countryName, orgList);
                        }

                        if (isOrgMember) return { fillColor: '#0284c7', fillOpacity: 0.85, weight: 1.5, color: '#38bdf8' };
                        return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                    }

                    if (currentActiveItem.type === 'conflict') {
                        const confCountries = currentActiveItem.data.countries;
                        let activeC = null;
                        for (let key of Object.keys(confCountries)) {
                            if (checkExactMembership(countryName, [key])) {
                                activeC = confCountries[key];
                                break;
                            }
                        }
                        if (activeC) return { fillColor: activeC.color, fillOpacity: 0.85, weight: 2, color: '#ffffff' };
                        return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                    }

                    if (currentActiveItem.type === 'news') {
                        const newsCountries = currentActiveItem.data.countries;
                        let activeC = null;
                        if (newsCountries) {
                            for (let key of Object.keys(newsCountries)) {
                                if (checkExactMembership(countryName, [key])) {
                                    activeC = newsCountries[key];
                                    break;
                                }
                            }
                        }
                        if (activeC) return { fillColor: activeC.color, fillOpacity: 0.85, weight: 2, color: '#ffffff' };
                        return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                    }

                    return { fillColor: '#050811', fillOpacity: 0.1, weight: 0.5, color: '#1e293b' };
                },
                onEachFeature: (feature, layer) => {
                    const countryName = feature.properties.name || feature.properties.ADMIN;
                    let matchedKey = null;
                    for (let key of Object.keys(countryProfiles)) {
                        if (checkExactMembership(countryName, [key])) {
                            matchedKey = key;
                            break;
                        }
                    }

                    layer.on('click', () => showCountryCard(matchedKey || countryName, countryName));

                    if (currentActiveItem.type === 'org') {
                        const orgId = currentActiveItem.id;
                        if (orgId === 'UN' || checkExactMembership(countryName, orgInfoData[orgId]?.membersEn || [])) {
                            highlightedBounds.extend(layer.getBounds());
                        }
                    } else if (currentActiveItem.type === 'conflict' || currentActiveItem.type === 'news') {
                        const activeCountries = currentActiveItem.data.countries || {};
                        for (let key of Object.keys(activeCountries)) {
                            if (checkExactMembership(countryName, [key])) {
                                highlightedBounds.extend(layer.getBounds());
                                const turkishName = countryProfiles[key]?.trName || trNameDict[countryName] || countryName;
                                layer.bindPopup(`<b>${turkishName}</b><br>Rol: ${activeCountries[key].role}`);
                            }
                        }
                    }
                }
            }).addTo(map);

            if (currentActiveItem.type === 'org' && currentActiveItem.id === 'UN') {
                map.setView([20.0, 0.0], 2, { animate: true });
            } else if (highlightedBounds.isValid()) {
                map.fitBounds(highlightedBounds, { padding: [40, 40], maxZoom: 4, animate: true });
            }
        }

        function showCountryCard(countryCode, originalName) {
            const card = document.getElementById('countryCard');
            const profile = countryProfiles[countryCode];
            const cleanTurkishName = profile?.trName || trNameDict[originalName] || trNameDict[countryCode] || originalName || countryCode;

            if (profile) {
                document.getElementById('cardCountryName').innerText = profile.trName;
                document.getElementById('cardFounding').innerText = profile.founding;
                document.getElementById('cardPop').innerText = profile.pop;
                document.getElementById('cardArea').innerText = profile.area;
                document.getElementById('cardPact').innerText = profile.pact;
            } else {
                document.getElementById('cardCountryName').innerText = cleanTurkishName;
                document.getElementById('cardFounding').innerText = "Egemen Devlet";
                document.getElementById('cardPop').innerText = "BM Üyesi Devlet";
                document.getElementById('cardArea').innerText = "Bölgesel Veri";
                document.getElementById('cardPact').innerText = "Uluslararası Üye";
            }
            card.style.display = 'block';
        }

        function filterByTag(tagName, event) {
            if(event) event.stopPropagation();
            selectedTagFilter = tagName;
            document.getElementById('activeTagText').innerText = tagName;
            document.getElementById('tagSearchInfo').style.display = 'flex';
            if (currentMainMode !== 'news') switchMainMode('news');
            else renderNewsList();
        }

        function clearTagFilter() {
            selectedTagFilter = null;
            document.getElementById('tagSearchInfo').style.display = 'none';
            renderNewsList();
        }

        function switchMobileTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const sidebar = document.getElementById('sidebarSection');
            const mapSec = document.getElementById('mapSection');
            const panel = document.getElementById('panelSection');

            sidebar.classList.remove('mobile-active');
            mapSec.classList.remove('mobile-active');
            panel.classList.remove('mobile-active');

            if (tabName === 'news') {
                sidebar.classList.add('mobile-active');
            } else if (tabName === 'map') {
                mapSec.classList.add('mobile-active');
                setTimeout(() => map.invalidateSize(), 200);
            } else if (tabName === 'panel') {
                panel.classList.add('mobile-active');
            }
        }
    </script>
</body>
</html>

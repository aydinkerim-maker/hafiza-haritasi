name: Gunluk Jeopolitik Haber Botu

on:
  schedule:
    # Her gün UTC ile 05:00 (TSİ 08:00) çalışır
    - cron: '0 5 * * *'
  workflow_dispatch: # Elle tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Botu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Degisiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name 'Geopolitical Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add newsData.json
          git commit -m "Otomatik Gunluk Haber Guncellemesi" || exit 0
          git push

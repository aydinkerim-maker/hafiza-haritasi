name: Gunluk Jeopolitik Haber Botu

on:
  schedule:
    - cron: '0 5,9,13,17,21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutuphaneleri Kur
        run: pip install requests

      - name: Botu Calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python bot.py

      - name: Degisiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add newsData.json
          git pull --rebase origin main
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Haber Güncellemesi" && git push)
